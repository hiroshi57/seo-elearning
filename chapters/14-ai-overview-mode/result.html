[{"id":"q0a","type":"single","sectionIndex":0,"question":"生成AIと検索エンジンの技術的な関係についての説明として、最も適切なものはどれか。","options":["生成AIと検索エンジンは、技術的にまったく無関係な別々の技術である","検索エンジンは今後、生成AIに完全に置き換えられてなくなる","生成AIは、検索エンジンが培ってきた自然言語処理技術の延長線上で生まれた技術であり、両者は地続きの関係にある","生成AIはランキングや検索意図の理解には一切関わっていない"],"correct":[2],"explain":"検索エンジンで培われてきた言語理解モデルと生成AIのモデルは、共通してトランスフォーマー構造を基盤とした言語モデルの進化の延長線上にあり、検索と生成は技術的に分断されたものではありません。"},{"id":"q0b","type":"single","sectionIndex":0,"question":"LLM（大規模言語モデル）の基本的な仕組みの説明として、最も適切なものはどれか。","options":["あらかじめ人間が定義した文法規則のみに基づいて動作する","検索結果の広告枠の入札額を自動計算する仕組みである","Webページの表示速度を計測するための仕組みである","大量のテキストデータを学習し、文脈に応じて次に現れる単語を予測する仕組みを基本とする"],"correct":[3],"explain":"LLMは大量のテキストデータを学習し、文脈に応じて次に現れる単語を予測する自己回帰型の仕組みを基本としており、これが文章生成や要約、対話能力の基盤になっています。"},{"id":"q1","type":"single","sectionIndex":1,"question":"AI Overviewの説明として、最も適切なものはどれか。","options":["検索結果の上部に、複数のWebページをもとにAIが生成した要約回答を表示する機能","検索結果の広告枠を自動的に非表示にする機能","サイトの表示速度を自動的に高速化する機能","ユーザーの個人情報を検索結果に表示する機能"],"correct":[0],"explain":"AI Overviewは、ユーザーの検索クエリに対して複数のWebページの情報をもとにAIが要約した回答を、検索結果の上部に表示する機能です。"},{"id":"q1b","type":"single","sectionIndex":1,"question":"AI Overviewの普及にともなう検索行動の変化についての説明として、最も適切なものはどれか。","options":["検索結果からのクリック率は、AI Overviewの導入によって一切変化していない","検索結果ページ上で疑問が解決し、サイトへのクリックが発生しない「ゼロクリック検索」が増加しているとされる","AI Overviewが表示されると、必ず全ユーザーがリンクをクリックするようになる","ゼロクリック検索はAI Overviewの登場以前には存在しなかった概念である"],"correct":[1],"explain":"AI Overviewの普及にともない、検索結果ページ上で要点を把握してサイトへ遷移しない「ゼロクリック検索」が増加しているとされ、従来の「上位表示されれば流入が増える」という前提が崩れつつあります。"},{"id":"q2","type":"single","sectionIndex":2,"question":"AI ModeとAI Overviewの違いに関する説明として、最も適切なものはどれか。","options":["AI ModeとAI Overviewは全く同じ機能であり、違いはない","AI Modeは広告専用の機能であり、検索結果には一切関係しない","AI Modeは、複雑な比較・深掘りを対話形式で行える検索体験であり、AI Overviewは検索結果の一部として要約を表示する","AI Overviewの方がAI Modeより後に登場した、より新しい機能である"],"correct":[2],"explain":"AI Modeはより複雑な質問や比較・深掘りを対話形式で行える検索体験であり、AI Overviewは通常の検索結果の一部として要約を表示する機能です。"},{"id":"q3","type":"single","sectionIndex":3,"question":"AI Overview・AI Modeに表示されるための要件について、Google公式が示している見解として、最も適切なものはどれか。","options":["専用の新しいファイルやマークアップを追加しなければ、絶対に表示されない","AI検索機能への表示には、追加費用の支払いが必要である","従来のSEO対策は、AI検索機能には一切関係しない","表示されるための特別な追加要件や最適化は存在しないとしている"],"correct":[3],"explain":"Google公式は、AI OverviewやAI Modeに表示されるための追加の要件や特別な最適化は存在しないと明言しています。"},{"id":"q4","type":"multi","sectionIndex":3,"question":"AI検索機能への対応として、Google公式が重要だとしている要素をすべて選べ。","options":["E-E-A-T（経験・専門性・権威性・信頼性）","独自性があり、訪問者にとって満足度の高いコンテンツ","クロールのしやすさ・サイト構造・モバイル対応・表示速度","サイトのドメイン名の文字数をできるだけ短くすること"],"correct":[0,1,2],"explain":"クロールのしやすさ・サイト構造・独自性のあるコンテンツ・E-E-A-Tは、Google公式がAI検索機能への対応でも重要だとしている要素です。ドメイン名の文字数は関係ありません。"},{"id":"q5","type":"single","sectionIndex":3,"question":"AI検索時代におけるSEOの基本の位置づけについて、最も適切なものはどれか。","options":["AI検索機能への対応は、これまで学んだSEOの基本の延長線上にある","AI検索の登場により、これまでのSEOの基本はすべて無意味になった","AI検索対策とSEO対策は、完全に別々の、無関係な取り組みである","AI検索が普及したため、コンテンツの品質はもはや評価に関係しない"],"correct":[0],"explain":"Google公式の方針によれば、AI検索機能への対応は、クロール・サイト構造・独自性・E-E-A-Tといった、これまで学んだSEOの基本の延長線上にあります。"}]
