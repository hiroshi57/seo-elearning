[{"id":"q1","type":"single","sectionIndex":0,"question":"リライトの説明として、最も適切なものはどれか。","options":["既存のコンテンツを削除し、二度と公開しないこと","既存のコンテンツを見直し、情報更新やタイトル・内部リンクの改善などを行うこと","新規記事だけを増やし続けること","サイトのデザインだけを変更すること"],"correct":[1],"explain":"リライトとは、公開済みのコンテンツについて情報の更新やタイトル・見出し・内部リンクの見直しなどを行い、価値を高める作業です。"},{"id":"q2","type":"multi","sectionIndex":0,"question":"リライトの判断材料として活用できる観点として、正しいものをすべて選べ。","options":["キーワード・検索意図とのズレがないか","タイトル・見出し・内部リンクは適切か","情報が古くなっていないか","サイトの創業年だけを基準にする"],"correct":[0,1,2],"explain":"検索意図とのズレ、タイトル・見出し・内部リンクの適切さ、情報の鮮度はリライトの判断材料になります。創業年そのものは判断材料になりません。"},{"id":"q3","type":"single","sectionIndex":1,"question":"リライトの対象として、比較的改善効果が見込みやすいとされるページの特徴はどれか。","options":["検索結果の100位以下にあるページ","検索結果の2ページ目付近（おおよそ6位〜20位程度）にあるページ","すでに検索結果で1位に表示されているページ","まだ一度も公開していないページ"],"correct":[1],"explain":"検索結果の2ページ目付近に位置するページは、すでに一定の評価を得ているため、内容の改善によって上位表示につながる可能性が比較的高いとされています。"},{"id":"q4","type":"single","sectionIndex":1,"question":"「掲載順位は高いが、CTRが低い」ページに対するリライトの方向性として、最も適切なものはどれか。","options":["そのページを検索結果から削除する","タイトル・ディスクリプションを見直し、クリックされやすい表現に改善する","本文をすべて削除する","何もせず放置する"],"correct":[1],"explain":"掲載順位は高いのにクリックされにくい場合は、タイトルやディスクリプションを見直し、クリックされやすい表現に改善することが有効です。"},{"id":"q5","type":"single","sectionIndex":1,"question":"リライトの際の注意点として、最も適切なものはどれか。","options":["タイトルは毎日大幅に変更した方がよい","すでに評価を得ているページのタイトルの過度な変更は、評価に悪影響を及ぼすリスクがある","リライト後は検索パフォーマンスの推移を確認する必要はない","リライトは一度行えば、二度と見直す必要はない"],"correct":[1],"explain":"すでに評価を得ているページのタイトルを頻繁・大幅に変更すると、評価がリセットされたり不自然な変更と受け取られたりするリスクがあります。変更は必要な範囲にとどめ、効果を確認しながら進めることが望ましいとされています。"}]
