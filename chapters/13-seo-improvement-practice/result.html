  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"リライトの説明として、最も適切なものはどれか。","options":["既存のコンテンツを削除し、二度と公開しないこと","既存のコンテンツを見直し、情報更新やタイトル・内部リンクの改善などを行うこと","新規記事だけを増やし続けること","サイトのデザインだけを変更すること"],"correct":[1],"explain":"リライトとは、公開済みのコンテンツについて情報の更新やタイトル・見出し・内部リンクの見直しなどを行い、価値を高める作業です。"},{"id":"q2","type":"multi","sectionIndex":0,"question":"リライトの判断材料として活用できる観点として、正しいものをすべて選べ。","options":["キーワード・検索意図とのズレがないか","タイトル・見出し・内部リンクは適切か","情報が古くなっていないか","サイトの創業年だけを基準にする"],"correct":[0,1,2],"explain":"検索意図とのズレ、タイトル・見出し・内部リンクの適切さ、情報の鮮度はリライトの判断材料になります。創業年そのものは判断材料になりません。"},{"id":"q3","type":"single","sectionIndex":1,"question":"リライトの対象として、比較的改善効果が見込みやすいとされるページの特徴はどれか。","options":["検索結果の100位以下にあるページ","検索結果の2ページ目付近（おおよそ6位〜20位程度）にあるページ","すでに検索結果で1位に表示されているページ","まだ一度も公開していないページ"],"correct":[1],"explain":"検索結果の2ページ目付近に位置するページは、すでに一定の評価を得ているため、内容の改善によって上位表示につながる可能性が比較的高いとされています。"},{"id":"q4","type":"single","sectionIndex":1,"question":"リライトの際の注意点として、最も適切なものはどれか。","options":["タイトルは毎日大幅に変更した方がよい","すでに評価を得ているページのタイトルの過度な変更は、評価に悪影響を及ぼすリスクがある","リライト後は検索パフォーマンスの推移を確認する必要はない","リライトは一度行えば、二度と見直す必要はない"],"correct":[1],"explain":"すでに評価を得ているページのタイトルを頻繁・大幅に変更すると、評価がリセットされたり不自然な変更と受け取られたりするリスクがあります。変更は必要な範囲にとどめ、効果を確認しながら進めることが望ましいとされています。"},{"id":"q5","type":"single","sectionIndex":2,"question":"検索順位が下落した際に考えられる、コンテンツ品質の低下以外の要因として、最も適切なものはどれか。","options":["検索意図が変化し、そのページでは意図を満たせなくなったと判断された可能性","サーバーの色が変わった影響","会社のロゴを変更した影響","順位は品質以外の要因で変動することは一切ない"],"correct":[0],"explain":"順位下落はコンテンツ品質の低下だけでなく、検索意図の変化によって「そのページでは意図を満たせなくなった」と判断されるケースもあります。"},{"id":"q6","type":"single","sectionIndex":3,"question":"重複・類似コンテンツを統合する際の手順として、最も適切なものはどれか。","options":["統合元ページはそのまま放置し、何もリダイレクトを設定しない","統合先を決め、情報を再編集した上で、統合元から統合先へ301リダイレクトを設定する","統合元・統合先どちらも削除し、まったく新しいURLを作成する","重複コンテンツは統合せず、そのまま増やし続けるのがよい"],"correct":[1],"explain":"重複・類似コンテンツの統合では、統合先を決定し、情報を再編集した上で、統合元から統合先へ301リダイレクトを設定し、内部リンクやサイトマップも修正します。"},{"id":"q7","type":"single","sectionIndex":4,"question":"「URLの永続化」の考え方として、最も適切なものはどれか。","options":["URLは定期的に変更した方が、SEO評価が高まる","一度公開してインデックスされたページのURLは、そのページが存在し続ける限り変更しないことが基本方針である","URLの変更はSEO評価にまったく影響しない","URLはページごとにランダムに変えるべきである"],"correct":[1],"explain":"URLの永続化とは、一度公開してインデックスされたURLを、そのページが存在し続ける限り変更しないという考え方です。評価の蓄積やユーザーの利便性のために重要とされています。"},{"id":"q8","type":"multi","sectionIndex":4,"question":"やむを得ずURL・ドメインを変更する際に行うべき対応として、正しいものをすべて選べ。","options":["301リダイレクトを設定する","内部リンクやXMLサイトマップのURLを新しいものに修正する","ドメイン変更時はSearch Consoleでアドレス変更をリクエストする","旧URLへのリンクはすべて放置し、何も通知しない"],"correct":[0,1,2],"explain":"URL・ドメイン変更時は301リダイレクトの設定、内部リンク・サイトマップの修正、ドメイン変更時のSearch Consoleでのアドレス変更リクエストが必要です。重要なリンク元への通知も推奨されます。"},{"id":"q9","type":"single","sectionIndex":5,"question":"コアアップデートのロールアウト期間中の対応として、最も適切なものはどれか。","options":["変動を「速報値」として捉え、異常値を洗い出しつつ、拙速な修正対応は避ける","変動を検知した瞬間に、サイト全体を即座に作り直す","ロールアウト期間中はSearch Consoleを一切確認しない","ロールアウトが終わるまで、いかなる記録も残さない"],"correct":[0],"explain":"ロールアウト期間中の変動は「速報値」として位置づけ、異常値を洗い出しつつ、拙速な修正対応は避け、完了後の比較分析に備えることが推奨されます。"},{"id":"q10","type":"single","sectionIndex":5,"question":"YMYL領域（医療・法律・金融など）で順位が下落した際の考え方として、最も適切なものはどれか。","options":["個別ページのタイトルを1つ変更すれば、必ず順位は回復する","サイト全体の信頼性・専門性が評価されていない場合、個別ページの改善だけでは順位回復が難しいことがある","YMYL領域は通常のSEO評価と無関係である","順位が下落しても、YMYL領域では調査する必要がない"],"correct":[1],"explain":"YMYL領域では、サイト全体の信頼性・専門性が評価に大きく関与するため、個別ページの改善だけでは順位回復が難しい場合があり、サイト全体の評価構造を見直す必要があります。"},{"id":"q11","type":"single","sectionIndex":6,"question":"本章の締めくくりで述べられている、SEO担当者の本質的な役割として、最も適切なものはどれか。","options":["検索エンジンのアルゴリズムを完全に無視して施策を行うこと","ユーザーが持つニーズを把握し、それを最も的確に満たす手段を考案・具現化すること","常に同じ施策だけを繰り返し実行すること","データを一切見ずに、感覚だけで施策を決めること"],"correct":[1],"explain":"検索行動が変化し続ける時代においても、「ユーザーのニーズを把握し、最も的確に満たす手段を考案・具現化すること」がSEO担当者の本質的な役割であるとされています。"}]
