[{"id":"q1","type":"single","sectionIndex":0,"question":"SEO（検索エンジン最適化）の説明として、最も適切なものはどれか。","options":["検索エンジンに広告費を払い、検索結果の上部に強制的に表示させる施策","検索エンジンがコンテンツを理解しやすくし、ユーザーが検索を通じてサイトを見つけやすくするための施策","SNS上でのシェア数を増やすことだけを目的とした施策","サイトのデザインを流行に合わせて変更する施策"],"correct":[1],"explain":"SEOは検索順位を「買う」ものではなく、検索エンジンとユーザー双方にとって価値のある形にコンテンツ・サイト構造を最適化する取り組みです。"},{"id":"q2","type":"single","sectionIndex":0,"question":"検索エンジンがページをユーザーに届けるまでのプロセスの説明として、正しいものはどれか。","options":["インデックス（登録・整理）→クロール（巡回）→ランキング（順位付け）の順に処理される","クロール（巡回）でサイトを発見し、インデックス（登録・整理）を経て、ランキング（順位付け）で検索結果に並べられる","ランキング（順位付け）が最初に行われ、その後にクロールとインデックスが行われる","クロール・インデックス・ランキングはすべて同時に、独立して行われるため順序はない"],"correct":[1],"explain":"検索エンジンは「クロール（巡回・発見）→インデックス（登録・整理）→ランキング（順位付け）」の順でページをユーザーに届けます。"},{"id":"q3","type":"single","sectionIndex":1,"question":"SEOとリスティング広告の違いに関する説明として、正しいものはどれか。","options":["SEOは出稿した瞬間に効果が出るが、広告は効果が出るまで数カ月かかる","広告は一度上位表示されると、費用をかけなくても効果が半永久的に持続する","SEOは成果が出るまで時間がかかる一方、広告に比べて中長期的な費用対効果に優れる傾向がある","SEOと広告は目的が完全に同じであり、どちらか一方を選べば十分である"],"correct":[2],"explain":"広告は即効性がある一方、出稿を止めると効果も止まります。SEOは効果発現までに時間がかかりますが、資産として蓄積され中長期の費用対効果に優れます。"},{"id":"q4","type":"multi","sectionIndex":2,"question":"企業がSEOに取り組む際に直面しやすい課題として、正しいものをすべて選べ。","options":["成果が出るまでに一定の時間がかかる","検索エンジンのアルゴリズム変動に応じた継続的なメンテナンスが必要になる","出稿を停止すると同時にすべての効果が消える","質の低い施策（スパム的な手法など）は評価を下げるリスクがある"],"correct":[0,1,3],"explain":"「出稿停止で効果が消える」のは広告の特徴です。SEOは時間・継続メンテナンス・スパム的手法のリスクが主な課題です。"},{"id":"q5","type":"single","sectionIndex":3,"question":"SEOで「できないこと」として、最も適切なものはどれか。","options":["ユーザーの検索意図に応えるコンテンツを提供すること","検索エンジンにサイトの内容を正しく理解してもらうこと","特定キーワードでの掲載順位や集客数を確約すること","中長期的に企業やブランドへの信頼を構築すること"],"correct":[2],"explain":"検索エンジンのアルゴリズムは非公開かつ常に変動するため、特定の順位や集客数を確約することはできません。"}]
