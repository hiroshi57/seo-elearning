  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"multi","sectionIndex":0,"question":"タイトルタグを書く際の基本的な考え方として、正しいものをすべて選べ。","options":["本文と乖離した、興味を引くためだけの内容にする","サイト内の他のページと同じタイトルを使い回す","ページの内容と一致させる","対策したいキーワードを、不自然にならない範囲で含める"],"correct":[2,3],"explain":"タイトルはページの内容と一致させ、対策キーワードを含めることが基本です。他のページとの重複や、本文と乖離した内容は避けるべきとされています。"},{"id":"q2","type":"single","sectionIndex":1,"question":"見出し（hタグ）の使い方として、最も適切なものはどれか。","options":["文字を大きく見せたい箇所に、階層を無視して見出しタグを使う","h1→h2→h3のように階層構造を保ち、見出しだけで記事の流れが分かるようにする","1ページ内にh1を複数置き、重要な語をできるだけ多く見出しにする","見出しタグは装飾用で、検索エンジンにもユーザーにも意味を持たない"],"correct":[1],"explain":"見出しは階層構造を保って使い、見出しだけで流れが分かる設計が理想です。装飾目的での使用や、意味を持たないという理解は誤りです。"},{"id":"q3","type":"single","sectionIndex":2,"question":"内部リンクのアンカーテキストの付け方として、最も適切なものはどれか。","options":["「こちら」「詳しくはこちら」のような汎用的な表現で統一する","対策キーワードだけを羅列した文字列にする","リンク先の内容が分かる、具体的な文字列にする","アンカーテキストは順位に無関係なので、何でもよい"],"correct":[2],"explain":"アンカーテキストはリンク先の内容が分かる具体的な文字列にします。『こちら』のような汎用表現やキーワードの羅列は避けるべきです。"},{"id":"q4","type":"single","sectionIndex":2,"question":"内部リンクを設置する際の基準として、最も適切なものはどれか。","options":["関連性を問わず、とにかく多くのページへリンクを張る","内部リンクはクローラーの巡回には影響しないため、数だけ増やせばよい","内部リンクは記事末尾にまとめて置く形だけが正解である","リンク元とリンク先のコンテンツの関連性を考えて設置する"],"correct":[3],"explain":"内部リンクは関連性を踏まえて設置します。関連性を無視した大量リンクや、設置場所の画一的なルールが正解というわけではありません。"},{"id":"q5","type":"single","sectionIndex":3,"question":"FAQ（よくある質問）コンテンツがSEOに役立つとされる理由として、最も適切なものはどれか。","options":["ユーザーの疑問に直接答え、具体的な疑問形のロングテールキーワードにも対応しやすいため","本文の文字数を稼ぐことが主目的で、内容の質は問われないため","FAQ形式は検索エンジンに認識されず、競合に真似されにくいため","他ページの本文をそのまま転記すれば、手間なく作成できるため"],"correct":[0],"explain":"FAQはユーザーの疑問に直接答え、ロングテール対応にも役立ちます。文字数稼ぎやコピー転記が目的ではなく、検索エンジンにも認識されます。"},{"id":"q6","type":"single","sectionIndex":3,"question":"PAA（People Also Ask）の説明として、最も適切なものはどれか。","options":["ページの表示速度を計測するGoogleの公式ツール","検索結果に「他の人はこちらも質問」として表示される、関連する質問の一覧","広告の入札額と品質スコアを管理するGoogleの機能","構造化データの記述ミスを検証するGoogleのツール"],"correct":[1],"explain":"PAA（People Also Ask）は検索結果の関連質問一覧です。表示速度計測（PageSpeed Insights）や広告管理、構造化データ検証とは別物です。"},{"id":"gq_alt","type":"single","sectionIndex":0,"question":"画像の代替テキスト（alt属性）の付け方として、ガイドの推奨に最も近いものはどれか。","options":["対策キーワードをできるだけ多く詰め込む","すべての画像で同じ定型文を使い回す","画像の内容や文脈が伝わる、簡潔で具体的な説明を書く","SEOのため必ず長文で詳細に書く"],"correct":[2],"explain":"alt属性は画像の内容・文脈が伝わる簡潔で具体的な説明にします。キーワードの詰め込みや無意味な定型文は避けます。（スターターガイド『わかりやすい代替テキストを画像に追加する』）"},{"id":"gq_useful","type":"single","sectionIndex":0,"question":"「興味深く有益なサイト」にするための考え方として、ガイドの記述に最も近いものはどれか。","options":["主要コンテンツより広告を大きく目立たせて配置する","他サイトの文章をできるだけ多くコピーして情報量を増やす","専門家向けに、一般読者には伝わらない表現で書く","読者が使いそうな検索キーワードを予測し、その疑問に応える情報を用意する"],"correct":[3],"explain":"読者の検索キーワードを予測して有益な情報を提供することが基本です。気が散る広告や独自性のないコピーは避けます。（スターターガイド『興味深く有益なサイトにする』）"}]
