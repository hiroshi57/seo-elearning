  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"multi","sectionIndex":0,"question":"タイトルタグを書く際の基本的な考え方として、正しいものをすべて選べ。","options":["ページの内容と一致させる","対策したいキーワードを、不自然にならない範囲で含める","サイト内の他のページと同じタイトルを使い回す","本文と乖離した、興味を引くためだけの内容にする"],"correct":[0,1],"explain":"タイトルはページの内容と一致させ、対策キーワードを含めることが基本です。他のページとの重複や、本文と乖離した内容は避けるべきとされています。"},{"id":"q2","type":"single","sectionIndex":1,"question":"見出し（hタグ）の使い方として、最も適切なものはどれか。","options":["h1→h2→h3という階層構造を保って使う","デザインを優先し、階層構造は無視してよい","1つのページにh1タグは何個あっても問題にならない","見出しタグは検索エンジンにもユーザーにも意味を持たない装飾にすぎない"],"correct":[0],"explain":"見出しはh1→h2→h3という階層構造を保つことが基本で、文章構造をユーザーと検索エンジンの両方に伝える役割を持ちます。"},{"id":"q3","type":"single","sectionIndex":2,"question":"内部リンクのアンカーテキストの付け方として、最も適切なものはどれか。","options":["「こちら」「詳しくはこちら」のような汎用的な表現にする","リンク先の内容が分かる、具体的な文字列にする","アンカーテキストはSEOに一切関係しないため、何でもよい","リンク先のURLをそのまま表示するだけでよい"],"correct":[1],"explain":"アンカーテキストは「こちら」のような内容の分からない表現ではなく、リンク先のページの内容が分かる具体的な文字列にすることが基本です。"},{"id":"q4","type":"single","sectionIndex":2,"question":"内部リンクを設置する際の基準として、最も適切なものはどれか。","options":["関連性を問わず、できるだけ多くのページにリンクする","リンク元とリンク先のコンテンツの関連性を考えて設置する","内部リンクはクローラーの巡回には一切影響しない","内部リンクは記事の一番下にまとめて置くことだけが正解である"],"correct":[1],"explain":"内部リンクは、リンク元とリンク先のコンテンツの関連性を考えて設置することが基本です。関連性の高いページ同士をつなぐことがユーザーとクローラーの両方に役立ちます。"},{"id":"q5","type":"single","sectionIndex":3,"question":"FAQ（よくある質問）コンテンツがSEOに役立つとされる理由として、最も適切なものはどれか。","options":["ユーザーの疑問に直接答え、ロングテールキーワードへの対応にも役立つため","文字数を増やすことだけが目的で、内容は問われないため","FAQは検索エンジンには一切認識されないため","他のページの内容をそのままコピーすればよいため"],"correct":[0],"explain":"FAQはユーザーの疑問に直接答える形式のため検索意図に応えやすく、具体的な疑問形のロングテールキーワードにも対応しやすいコンテンツ形式です。"}]
