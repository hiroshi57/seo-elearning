[{"id":"q1","type":"single","sectionIndex":0,"question":"GA4における「自然検索（Organic Search）」の説明として、最も適切なものはどれか。","options":["検索結果の広告枠からのアクセスのみを指す","検索結果の広告枠を除いた、通常の検索結果からのアクセスを指す","SNSからの流入をすべてまとめたチャネルの名称","メールマガジン経由のアクセスを指す用語"],"correct":[1],"explain":"自然検索（Organic Search）は、検索結果の広告枠を除いた、通常の検索結果（オーガニック検索結果）からのアクセスを指すGA4のチャネルです。"},{"id":"q2","type":"single","sectionIndex":0,"question":"GA4でチャネルごとの流入状況を確認する際に使うレポートとして、最も適切なものはどれか。","options":["リアルタイムレポートのみ","集客のトラフィック獲得レポート","ユーザーの年齢・性別レポートのみ","GA4にはチャネル別の流入を確認する機能はない"],"correct":[1],"explain":"GA4の「集客」＞「トラフィック獲得」レポートで、自然検索を含むチャネルごとの流入状況を確認できます。"},{"id":"q3","type":"single","sectionIndex":1,"question":"ランディングページの説明として、最も適切なものはどれか。","options":["ユーザーがサイトを離脱する直前に見ていたページ","ユーザーが検索結果などを経由して最初にアクセスするページ","サイトの利用規約が書かれたページ","GA4の管理画面そのものを指す言葉"],"correct":[1],"explain":"ランディングページとは、ユーザーが検索結果などを経由して最初にアクセスするページのことです。"},{"id":"q4","type":"single","sectionIndex":1,"question":"「自然検索」と「ランディングページ」を組み合わせて分析するメリットとして、最も適切なものはどれか。","options":["サイトのデザインを自動的に改善できる","どのページが検索から流入を集め、成果につながっているかが具体的に見えてくる","広告費を自動的に削減できる","この組み合わせにはSEO上の意味はない"],"correct":[1],"explain":"自然検索×ランディングページで分析することで、検索からの流入とその成果への貢献度を具体的に把握でき、改善ポイントが見えてきます。"},{"id":"q5","type":"single","sectionIndex":2,"question":"GA4とSearch Consoleの連携に関する説明として、正しいものはどれか。","options":["連携すると、検索キーワードのデータをGA4上でも確認できるようになる","1つのGA4プロパティに、Search Consoleのデータストリームをいくつでも連携できる","連携は自動的に行われ、設定の必要は一切ない","連携するとSearch Consoleのデータが完全に削除される"],"correct":[0],"explain":"連携するとSearch Consoleの検索キーワードデータをGA4上で確認できます。ただし、1つのGA4プロパティに連携できるデータストリームは1つのみという制限があります。"}]
