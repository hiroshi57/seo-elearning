,"explain":"検索品質評価ガイドラインは外部評価者向けの内部マニュアルであり、それ自体がランキングアルゴリズムではありませんが、Googleが重視する品質基準を知る手がかりになります。"},{"id":"q5","type":"single","sectionIndex":2,"question":"コンテンツの独自性に関するGoogleの考え方として、最も適切なものはどれか。","options":["他サイトの内容を要約しただけのコンテンツが最も高く評価される","独自の視点・データ・分析を含むコンテンツは、品質評価において重視される傾向にある","独自性は検索順位に一切関係しない","文章の長さだけが独自性の判断基準になる"],"correct":[1],"explain":"Googleは、独自の視点・データ・分析を含む「そのページでしか得られない価値」があるコンテンツを重視する傾向にあります。"},{"id":"q6","type":"multi","sectionIndex":3,"question":"「内部要素」に含まれるものとして、正しいものをすべて選べ。","options":["コンテンツがユーザーニーズを満たしているか","E-E-A-Tが担保されているか","他サイトからのリンクや引用（サイテーション）","表示速度やモバイル対応"],"correct":[0,1,3],"explain":"内部要素はサイト自身でコントロールできる範囲の評価要素です。他サイトからのリンクや引用は「外部要素」に分類されます。"},{"id":"q7","type":"single","sectionIndex":3,"question":"「外部要素」の評価において重視される点として、最も適切なものはどれか。","options":["他サイトから言及される回数が多ければ多いほど良い","どのような文脈・信頼性を持つサイトから参照されているかという質的な側面","外部要素はGoogleの評価に一切関係しない","自社で作成した別サイトから大量にリンクを送ることが最も有効な対策である"],"correct":[1],"explain":"外部要素で重視されるのは言及の量そのものではなく、どのような文脈・信頼性を持つサイトから参照されているかという質的な側面です。"}]
