[{"id":"q1","type":"single","sectionIndex":0,"question":"コアアップデートの説明として、最も適切なものはどれか。","options":["特定の1サイトをターゲットにしてGoogleが行う個別のペナルティ処置","検索結果全体の有用性・信頼性を高めることを目的とした、広範なアルゴリズム変更","サイト運営者が自分で申請することで受けられる順位向上の施策","月に一度、必ず同じ日に実施されると決まっている更新"],"correct":[1],"explain":"コアアップデートは特定のサイトを狙い撃ちするものではなく、検索結果全体の有用性・信頼性を高めることを目的とした広範なアルゴリズム変更です。"},{"id":"q2","type":"single","sectionIndex":0,"question":"コアアップデート後に自社サイトの順位が下がった場合の考え方として、最も適切なものはどれか。","options":["必ずGoogleからペナルティを受けたことを意味する","コンテンツの品質や有用性を見直す一つの機会と捉えるのが実務上の考え方である","順位が下がった場合は何もせず、Googleに直接抗議すべきである","コアアップデートとサイトの順位変動には一切関係がない"],"correct":[1],"explain":"コアアップデートによる順位変動は「ペナルティ」ではなく、コンテンツの品質や有用性を見直す機会と捉えるのが実務上の考え方です。"},{"id":"q3","type":"multi","sectionIndex":1,"question":"Googleが「役立つコンテンツ」を判断する際に重視するとされる観点として、正しいものをすべて選べ。","options":["検索するユーザーにとって本当に役立つ内容になっているか","専門知識を持つ人物・情報源によって作られているか","他のページには無い、独自の視点・データ・分析が含まれているか","検索エンジン向けにキーワードをできる限り多く詰め込んでいるか"],"correct":[0,1,2],"explain":"ユーザーへの有用性、専門性、独自性が重視される観点です。キーワードを詰め込んだだけのユーザー不在のコンテンツは、むしろ評価されにくい傾向にあります。"},{"id":"q4","type":"single","sectionIndex":1,"question":"「検索品質評価ガイドライン」に関する説明として、正しいものはどれか。","options":["検索順位を自動的に決定するアルゴリズムそのものである","外部の評価者向けにGoogleが運用している内部マニュアルであり、Googleが重視する品質の基準を知る手がかりになる","サイト運営者が自分のサイトを自己採点するための公式スコアリングツールである","コアアップデートとは無関係の、広告審査専用の文書である"],"correct":[1],"explain":"検索品質評価ガイドラインは外部評価者向けの内部マニュアルであり、それ自体がランキングアルゴリズムではありませんが、Googleが重視する品質基準を知る手がかりになります。"},{"id":"q5","type":"single","sectionIndex":1,"question":"コンテンツの独自性に関するGoogleの考え方として、最も適切なものはどれか。","options":["他サイトの内容を要約しただけのコンテンツが最も高く評価される","独自の視点・データ・分析を含むコンテンツは、品質評価において重視される傾向にある","独自性は検索順位に一切関係しない","文章の長さだけが独自性の判断基準になる"],"correct":[1],"explain":"Googleは、独自の視点・データ・分析を含む「そのページでしか得られない価値」があるコンテンツを重視する傾向にあります。"}]
