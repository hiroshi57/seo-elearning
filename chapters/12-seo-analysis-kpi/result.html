[{"id":"q1","type":"single","sectionIndex":0,"question":"KGIとKPIの関係についての説明として、最も適切なものはどれか。","options":["KGIとKPIは全く同じ意味で、使い分ける必要はない","KGIは最終的な目標を示し、KPIはKGIを達成するための中間指標である","KPIは最終目標で、KGIはその中間指標である","KGIとKPIはSEOには一切関係のない用語である"],"correct":[1],"explain":"KGI（重要目標達成指標）は最終目標を示し、KPI（重要業績評価指標）はKGIを達成するための中間指標という関係にあります。"},{"id":"q2","type":"multi","sectionIndex":0,"question":"SEOでよく使われるKPIの例として、正しいものをすべて選べ。","options":["自然検索経由のセッション数・ユーザー数","主要キーワードの掲載順位","自然検索経由のキーイベント（CV）数・CV率","社員の有給休暇取得率"],"correct":[0,1,2],"explain":"自然検索の流入数、掲載順位、CV数・CV率はSEOでよく使われるKPIの例です。有給休暇取得率はSEOのKPIとは関係ありません。"},{"id":"q3","type":"single","sectionIndex":1,"question":"KPIを設定する際の考え方として、最も適切なものはどれか。","options":["追いかけるKPIはできるだけ多く、20個以上設定すべきである","主要なKPIを3〜5個程度に絞り込むことで、注目すべき変化が見えやすくなる","KPIは一度設定したら、事業フェーズが変わっても変更してはならない","KPIはGA4やSearch Consoleとは無関係に決めるべきである"],"correct":[1],"explain":"追いかけるKPIが多すぎると重要な変化を見失いやすくなるため、主要なKPIを3〜5個程度に絞り込むことが実務上の目安とされています。"},{"id":"q4","type":"single","sectionIndex":1,"question":"事業フェーズとKPIの関係についての説明として、最も適切なものはどれか。","options":["集客の立ち上げ期でも、一定の集客確保後でも、重視すべきKPIは常に同じである","集客の立ち上げ期は流入数や掲載順位、一定の集客確保後はCV数・CV率が重視されやすい","事業フェーズはSEOのKPI設定には一切関係しない","KPIは事業開始時に一度決めたら、二度と見直してはいけない"],"correct":[1],"explain":"集客の立ち上げ期は流入数・掲載順位などが重視されやすく、一定の集客が確保できた後はCV数・CV率などKGIに直結する指標が重視される傾向にあります。"},{"id":"q5","type":"single","sectionIndex":1,"question":"SEO改善施策の優先順位をつける際の考え方として、最も適切なものはどれか。","options":["すべてのページを同時に、同じ優先度で改善する","GA4・Search Consoleのデータをもとに、改善余地が大きい箇所から優先的に着手する","優先順位は考えず、思いついた順にランダムに改善する","改善の優先順位づけにはデータを使わない方がよい"],"correct":[1],"explain":"GA4・Search Consoleのデータから、流入は多いがCVにつながっていないページなど、改善余地の大きい箇所を特定し、優先的に着手することが効果的なアプローチです。"}]
