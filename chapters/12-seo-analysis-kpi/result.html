  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"KGIとKPIの関係についての説明として、最も適切なものはどれか。","options":["KPIが最終目標で、KGIはその達成度を測る補助指標である","KGIは日次で追う指標、KPIは四半期で追う指標という時間軸の違いである","KGIは最終的な目標を示し、KPIはKGIを達成するための中間指標である","KGIは定量指標、KPIは定性指標という測定方法の違いである"],"correct":[2],"explain":"KGI（最終目標）とKPI（中間指標）の関係です。両者の役割を逆にしたり、時間軸・定量定性の違いと説明したりするのは誤りです。"},{"id":"q2","type":"multi","sectionIndex":0,"question":"SEOでよく使われるKPIの例として、正しいものをすべて選べ。","options":["自然検索経由のセッション数・ユーザー数","主要キーワードの掲載順位","自然検索経由のキーイベント（CV）数・CV率","社員の有給休暇取得率"],"correct":[0,1,2],"explain":"自然検索の流入数、掲載順位、CV数・CV率はSEOでよく使われるKPIの例です。有給休暇取得率はSEOのKPIとは関係ありません。"},{"id":"q3","type":"single","sectionIndex":1,"question":"KPIを設定する際の考え方として、最も適切なものはどれか。","options":["追いかけるKPIはできるだけ多く、20個以上設定すべきである","KPIは一度設定したら、事業フェーズが変わっても変更してはならない","KPIはGA4やSearch Consoleとは無関係に決めるべきである","主要なKPIを3〜5個程度に絞り込むことで、注目すべき変化が見えやすくなる"],"correct":[3],"explain":"追いかけるKPIが多すぎると重要な変化を見失いやすくなるため、主要なKPIを3〜5個程度に絞り込むことが実務上の目安とされています。"},{"id":"q4","type":"single","sectionIndex":1,"question":"事業フェーズとKPIの関係についての説明として、最も適切なものはどれか。","options":["集客の立ち上げ期は流入数や掲載順位、一定の集客確保後はCV数・CV率が重視されやすい","集客の立ち上げ期でも、一定の集客確保後でも、重視すべきKPIは常に同じである","事業フェーズはSEOのKPI設定には一切関係しない","KPIは事業開始時に一度決めたら、二度と見直してはいけない"],"correct":[0],"explain":"集客の立ち上げ期は流入数・掲載順位などが重視されやすく、一定の集客が確保できた後はCV数・CV率などKGIに直結する指標が重視される傾向にあります。"},{"id":"q5","type":"single","sectionIndex":2,"question":"Search Consoleの標準的なデータ保持期間として、最も適切なものはどれか。","options":["3か月","16か月","24か月","無期限（制限なし）"],"correct":[1],"explain":"Search Consoleの標準データ保持期間は16か月です。長期比較にはBigQueryなどへのエクスポートが必要になります。"},{"id":"q6","type":"single","sectionIndex":2,"question":"Search Consoleの「一括データエクスポート」機能でBigQueryにデータを送る利点として、最も適切なものはどれか。","options":["エクスポートできる行数が最大1,000行に制限される","送信するとSearch Consoleの保持期間が3か月に短縮される","行数無制限でデータを蓄積でき、GA4など他データとの統合分析もしやすくなる","送信後はSearch Consoleの管理画面が使えなくなる"],"correct":[2],"explain":"BigQueryへの一括エクスポートは行数無制限で蓄積でき、他データとの統合分析に向きます。行数1,000行制限は管理画面の制約です。"},{"id":"q7","type":"single","sectionIndex":3,"question":"被リンクのモニタリングに関する説明として、最も適切なものはどれか。","options":["被リンクは一度獲得すれば価値が永久に保証されるため、確認は不要である","被リンクの確認はGA4のトラフィック獲得レポートで行う","被リンクは内部リンクの一種で、サイト内だけで完結する","被リンクは現時点の外部評価を映す指標で、失われることもあるため継続的な確認が必要"],"correct":[3],"explain":"被リンクは蓄積される固定資産ではなく、現時点の外部評価を映す指標です。失われることもあるため継続的なモニタリングが必要です。"},{"id":"q8","type":"single","sectionIndex":3,"question":"順位や流入の異常を早期に検知する仕組みとして、最も適切なものはどれか。","options":["GA4のカスタムインサイトやLooker Studioのアラート機能を使い、条件に合致した際に通知を受け取る","毎日手作業ですべてのページを目視確認する以外に方法はない","異常検知の仕組みを作ることは、SEO業務には不要である","アラート機能は、順位や流入のデータには対応していない"],"correct":[0],"explain":"GA4のカスタムインサイトやLooker Studioのグラフのアラート機能を使うことで、指定した条件に合致した際に通知を受け取り、異常を早期に検知できます。"}]
