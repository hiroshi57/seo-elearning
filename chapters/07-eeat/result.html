[{"id":"q1","type":"multi","sectionIndex":0,"question":"E-E-A-Tを構成する要素として、正しいものをすべて選べ。","options":["Experience（経験）","Expertise（専門性）","Authoritativeness（権威性）","Efficiency（効率性）"],"correct":[0,1,2],"explain":"E-E-A-Tは Experience（経験）・Expertise（専門性）・Authoritativeness（権威性）・Trust（信頼性）の4要素から構成されます。Efficiency（効率性）は含まれません。"},{"id":"q2","type":"single","sectionIndex":0,"question":"E-E-A-TのExperience（経験）が示す内容として、最も適切なものはどれか。","options":["コンテンツの文字数が多いこと","実際にその物事を経験した人物による情報であること","サイトの表示速度が速いこと","検索結果で1位に表示された実績があること"],"correct":[1],"explain":"Experience（経験）は、実際にその物事を経験した人物による情報かどうかを示す要素です。"},{"id":"q3","type":"single","sectionIndex":1,"question":"E-E-A-Tの4要素の関係性についての説明として、最も適切なものはどれか。","options":["4要素はすべて独立していて、互いに影響しない","信頼性（Trust）が中心的な位置づけにあり、他の要素が高くても信頼性が欠けると評価が下がる","権威性（Authoritativeness）が最も重要で、他の3要素は無視してよい","経験（Experience）だけがあれば、他の3要素は不要である"],"correct":[1],"explain":"信頼性（Trust）は他の3要素を支える中心的な位置づけにあり、経験・専門性・権威性が高くても信頼性が欠けるとE-E-A-T全体の評価は低くなるとされています。"},{"id":"q4","type":"single","sectionIndex":1,"question":"YMYL（Your Money or Your Life）の説明として、最も適切なものはどれか。","options":["お金や健康、安全、幸福に直接影響する可能性がある領域を指すGoogleの用語","検索エンジンの表示速度を測定する専門用語","特定のSEOツールの名称","SNSでのシェア数を評価する指標"],"correct":[0],"explain":"YMYLは「Your Money or Your Life」の略で、お金・健康・安全・幸福など、人の生活に直接影響する可能性がある領域を指すGoogleの用語です。"},{"id":"q5","type":"single","sectionIndex":1,"question":"YMYL領域でE-E-A-Tが特に重視される理由として、最も適切なものはどれか。","options":["YMYL領域は検索されることが少ないため、逆に評価が甘くなるから","お金や健康など、人の生活に大きな影響を与える可能性がある情報だから","YMYL領域はGoogleの評価対象外だから","YMYLはE-E-A-Tと全く関係のない、別の評価基準だから"],"correct":[1],"explain":"YMYL領域はお金や健康など人の生活に大きな影響を与える可能性があるため、誤った情報や信頼性の低い情報が与えるリスクが大きく、E-E-A-Tが特に重視されます。"}]
