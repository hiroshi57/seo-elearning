[{"id":"q1","type":"single","sectionIndex":0,"question":"Googleが推奨するURL構造の考え方として、最も適切なものはどれか。","options":["意味の分からないランダムな文字列・数字の羅列にする","わかりやすく予測可能で、人間にも理解しやすい構造にする","URLの長さは検索順位に一切関係しないため、何でもよい","サイトの構造とURLは無関係にすべきである"],"correct":[1],"explain":"Googleは公式のSEOスターターガイドで、わかりやすく予測可能で、人間にも理解しやすいURL構造を推奨しています。"},{"id":"q2","type":"single","sectionIndex":1,"question":"内部リンクとクロールのしやすさに関する説明として、最も適切なものはどれか。","options":["どのページからもリンクされていないページは、クローラーが発見しにくくなる","内部リンクはクローラーの巡回には一切関係しない","重要なページほど、他のページからリンクしない方がよい","内部リンクはユーザー体験にのみ影響し、検索エンジンには影響しない"],"correct":[0],"explain":"どのページからもリンクされていない「孤立したページ」はクローラーが発見しにくくなります。重要なページほど複数箇所からリンクされている状態が望ましいとされています。"},{"id":"q3","type":"single","sectionIndex":2,"question":"XMLサイトマップに含めるべきURLとして、Google公式ガイドラインが推奨しているものはどれか。","options":["重複しているURLも含め、サイト内のすべてのURLをできる限り含める","canonicalで指定した正規URLのみを含める","アクセス数が少ないURLだけを含める","XMLサイトマップにはURLを1つも含めない方がよい"],"correct":[1],"explain":"Google公式のガイドラインでは、XMLサイトマップには正規URL（canonicalで指定したURL）のみを含めることが推奨されています。"},{"id":"q4","type":"single","sectionIndex":2,"question":"canonicalタグ（rel=\"canonical\"）の役割として、最も適切なものはどれか。","options":["ページの表示速度を向上させるためのタグ","同じ内容・似た内容のページが複数ある場合に、正規のURLを指定するためのタグ","検索結果の順位を強制的に固定するためのタグ","広告の表示を制御するためのタグ"],"correct":[1],"explain":"canonicalタグは、重複または類似する複数のURLの中から「正規のURLはこちらです」とGoogleに伝え、URLの正規化を行うためのタグです。"},{"id":"q5","type":"multi","sectionIndex":3,"question":"Core Web Vitalsを構成する3つの指標として、正しいものをすべて選べ。","options":["LCP（Largest Contentful Paint）：読み込み速度","INP（Interaction to Next Paint）：操作への応答性","CLS（Cumulative Layout Shift）：視覚的な安定性","CTR（Click Through Rate）：クリック率"],"correct":[0,1,2],"explain":"Core Web VitalsはLCP（読み込み速度）・INP（応答性）・CLS（視覚的安定性）の3指標で構成されます。CTR（クリック率）はCore Web Vitalsには含まれません。"}]
