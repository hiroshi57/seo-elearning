  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"MECE（ミーシー）なカテゴリ設計として、最も適切なものはどれか。","options":["カテゴリ同士が重複していても、抜け漏れさえなければよい","重複がなく、抜け漏れもない状態でカテゴリを分類すること","できるだけ多くのカテゴリに、同じページを重複して登録すること","カテゴリ分けは一切行わず、すべてのページをフラットに並べること"],"correct":[1],"explain":"MECEとは「重複なく、抜け漏れなく（Mutually Exclusive and Collectively Exhaustive）」分類されている状態を指します。"},{"id":"q2","type":"multi","sectionIndex":1,"question":"内部リンクの設計で重要とされる観点として、正しいものをすべて選べ。","options":["どのページからも他のページへ辿れる、双方向のリンク構造にする","関連するページ・上位カテゴリへリンクを張る","常にトップページ・最上位カテゴリへ戻れるリンクを用意する","リンクは一方向にのみ張り、行き止まりのページを作る"],"correct":[0,1,2],"explain":"内部リンクの設計では、双方向リンク・関連ページへのリンク・上位階層への復帰リンクの3点が重要とされています。行き止まりになる一方向のリンクは避けるべきとされています。"},{"id":"q3","type":"single","sectionIndex":2,"question":"XMLサイトマップに含めるべきURLとして、Google公式ガイドラインが推奨しているものはどれか。","options":["重複しているURLも含め、サイト内のすべてのURLをできる限り含める","canonicalで指定した正規URLのみを含める","アクセス数が少ないURLだけを含める","XMLサイトマップにはURLを1つも含めない方がよい"],"correct":[1],"explain":"Google公式のガイドラインでは、XMLサイトマップには正規URL（canonicalで指定したURL）のみを含めることが推奨されています。"},{"id":"q4","type":"single","sectionIndex":2,"question":"canonicalタグ（rel=\"canonical\"）の役割として、最も適切なものはどれか。","options":["ページの表示速度を向上させるためのタグ","同じ内容・似た内容のページが複数ある場合に、正規のURLを指定するためのタグ","検索結果の順位を強制的に固定するためのタグ","広告の表示を制御するためのタグ"],"correct":[1],"explain":"canonicalタグは、重複または類似する複数のURLの中から「正規のURLはこちらです」とGoogleに伝え、URLの正規化を行うためのタグです。"},{"id":"q5","type":"single","sectionIndex":3,"question":"meta robotsのcontent属性に「noindex」を指定した場合の効果として、最も適切なものはどれか。","options":["そのページの表示速度が向上する","そのページがインデックスされないようになる","そのページの検索順位が自動的に1位になる","そのページへの外部リンクがすべて無効になる"],"correct":[1],"explain":"meta robotsのcontent属性に「noindex」を指定すると、そのページはインデックスされないようになります。"},{"id":"q6","type":"multi","sectionIndex":4,"question":"Core Web Vitalsを構成する3つの指標として、正しいものをすべて選べ。","options":["LCP（Largest Contentful Paint）：読み込み速度","INP（Interaction to Next Paint）：操作への応答性","CLS（Cumulative Layout Shift）：視覚的な安定性","CTR（Click Through Rate）：クリック率"],"correct":[0,1,2],"explain":"Core Web VitalsはLCP（読み込み速度）・INP（応答性）・CLS（視覚的安定性）の3指標で構成されます。CTR（クリック率）はCore Web Vitalsには含まれません。"},{"id":"q7","type":"single","sectionIndex":4,"question":"Core Web Vitalsの指標の変遷についての説明として、正しいものはどれか。","options":["Core Web Vitalsの指標は発表以来、一度も変更されていない","2024年3月に、それまで使われていたFID（初回入力遅延）がINPに置き換えられた","LCPは2024年に廃止され、現在は使われていない","Core Web Vitalsはランキングシグナルとして使われたことは一度もない"],"correct":[1],"explain":"Core Web Vitalsは2021年6月からランキングシグナルとして使用されており、指標も更新されています。2024年3月には、それまでのFID（初回入力遅延）がINPに置き換えられました。"},{"id":"q8","type":"single","sectionIndex":5,"question":"HTTPS化とGoogleのランキングシグナルの関係について、公式ブログが示している見解として、最も適切なものはどれか。","options":["HTTPS化は検索順位に一切影響しない","HTTPS化はランキングシグナルとして使用されているが、コンテンツの品質など他の要素と比べると影響は軽微である","HTTPS化さえすれば、他の要素に関わらず必ず1位になれる","HTTPS化はセキュリティ上の意味しかなく、SEOとは無関係な施策である"],"correct":[1],"explain":"Google公式は2014年にHTTPS化をランキングシグナルとして使用すると発表しましたが、全体のクエリの1%未満にしか影響しない軽量なシグナルであり、コンテンツの品質などと比べると影響は小さいとしています。"},{"id":"q9","type":"multi","sectionIndex":5,"question":"HTTPSが持つセキュリティ上の役割として、正しいものをすべて選べ。","options":["通信データの暗号化","データ改ざんの検知","通信相手（サーバー）の認証","ページの表示速度を自動的に2倍にすること"],"correct":[0,1,2],"explain":"HTTPSは通信データの暗号化・改ざんの検知・通信相手の認証という3つのセキュリティ上の役割を持ちます。表示速度を「自動的に2倍にする」機能ではありません。"}]
