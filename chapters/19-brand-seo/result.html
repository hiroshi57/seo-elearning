  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"指名検索の説明として、最も適切なものはどれか。","options":["「SEO とは」のような一般的な情報を調べる検索","企業名やブランド名、商品名など固有名詞で検索されること","検索エンジンが自動的に生成する検索キーワード","広告経由でのみ発生する検索"],"correct":[1],"explain":"指名検索とは、企業名やブランド名、商品名など特定の固有名詞で検索されることを指します。"},{"id":"q2","type":"single","sectionIndex":1,"question":"外部要素の2つの分類として、最も適切な組み合わせはどれか。","options":["被リンクとサイテーション","内部リンクと外部リンク","検索ボリュームと競合性","ページランクとドメインパワー"],"correct":[0],"explain":"外部要素は大別すると、明示的な引用である「被リンク」と、暗示的な引用である「サイテーション」の2つに分かれます。"},{"id":"q3","type":"single","sectionIndex":1,"question":"被リンクとサイテーションのうち、検索エンジンにとって認識・評価しやすいのはどちらか。","options":["被リンク（明示的な引用のため）","サイテーション（暗示的な引用のため）","どちらも全く同じ精度で評価される","どちらも検索エンジンには一切認識されない"],"correct":[0],"explain":"被リンクはa要素による明示的な引用であるため、暗示的な引用であるサイテーションよりも検索エンジンが認識・評価しやすいと考えられています。"},{"id":"q4","type":"multi","sectionIndex":2,"question":"被リンクの評価要素として、本文で紹介されたものをすべて選べ。","options":["リンク元のページ評価（ページランク）","リンク元ページにおけるリンクの掲載状況","リンク元とリンク先のコンテンツ・文脈的な関連性","リンク元サイトのサーバー契約プラン"],"correct":[0,1,2],"explain":"被リンクの評価要素として、ページランク・リンクの掲載状況・コンテンツ及び文脈的な関連性・リンクエイジの4つが挙げられます。サーバー契約プランは評価要素ではありません。"},{"id":"q5","type":"single","sectionIndex":2,"question":"リンクエイジについての説明として、最も適切なものはどれか。","options":["リンクが張られてからの経過時間を表し、新しいリンクを継続的に獲得しているページが高く評価されると考えられている","リンクの文字色を表す指標である","リンク先ページの表示速度を表す指標である","被リンクの数を年齢に例えた冗談の表現にすぎない"],"correct":[0],"explain":"リンクエイジとは、被リンクが初めて張られてからの経過時間を表す考え方で、コンテンツの陳腐化を判別する手がかりの一つとされています。"},{"id":"q6","type":"multi","sectionIndex":3,"question":"コントローラブルな被リンク獲得方法として、本文で紹介されたものをすべて選べ。","options":["自社コーポレートサイトからのリンク","サテライトサイトからのリンク","リンクベイトによる他サイトからの自然なリンク獲得","リンクの売買による大量獲得"],"correct":[0,1,2],"explain":"自社コーポレートサイト・サテライトサイト・リンクベイトの3つがコントローラブルな獲得方法として紹介されました。リンクの売買はリンクスキームに該当し、ガイドライン違反です。"},{"id":"q7","type":"single","sectionIndex":3,"question":"リンクベイトの説明として、最も適切なものはどれか。","options":["他サイトからのリンクを呼び寄せるための、企画性の高いコンテンツ","リンク切れを検出するためのツール","自社サイト内のリンク構造を分析する手法","リンクを購入するための取引仲介サービス"],"correct":[0],"explain":"リンクベイトとは、他サイトからのリンクを呼び寄せる「餌」となる、企画性の高いコンテンツのことです。"},{"id":"q8","type":"single","sectionIndex":4,"question":"サイテーションと被リンクの違いとして、最も適切なものはどれか。","options":["サイテーションと被リンクは全く同じものである","サイテーションはクリック可能なリンクがなくても、名前の言及だけで成立する","被リンクはリンクがなくても成立し、サイテーションは必ずリンクが必要である","サイテーションは被リンクの別の呼び方にすぎない"],"correct":[1],"explain":"サイテーションは、クリック可能なリンクが付いていなくても、名前の言及だけで成立する点が被リンクとの決定的な違いです。"},{"id":"q9","type":"single","sectionIndex":4,"question":"サイテーション効果を得るために必要な対応として、最も適切なものはどれか。","options":["検索エンジンに自社情報を紐付けて認識させる必要はなく、言及されるのを待つだけでよい","自社の基本情報を構造化マークアップしたり、SNSアカウントを整備するなどして、検索エンジンにWebページとブランド情報を紐付けて認識させる","サイテーションはSEOと無関係なので、特に対応する必要はない","自社名を意図的に隠すことで、サイテーション効果が高まる"],"correct":[1],"explain":"検索エンジンがブランド名とWebページの関係性を認識していなければ、他ページでの言及も評価にはつながりません。構造化マークアップやSNSアカウントの整備などで、事前に紐付けを認識させることが重要です。"},{"id":"q10","type":"single","sectionIndex":5,"question":"OGPの設定に関する説明として、最も適切なものはどれか。","options":["全ページで同じtitleやdescription、imageを使い回すことが推奨される","ページごとにユニークなtitle・description・imageを設定することが望ましい","OGPを設定すると、サイトの表示速度が自動的に向上する","OGPはFacebookでのみ有効で、他のSNSには一切影響しない"],"correct":[1],"explain":"OGPは全ページ共通ではなく、ページごとにユニークな内容にすることで、リンク先の内容が正確に伝わり、クリックやシェアを促しやすくなります。"},{"id":"q11","type":"single","sectionIndex":5,"question":"ソーシャルメディアポリシーの目的として、最も適切なものはどれか。","options":["SNSでの広告費用を削減すること","アカウント運営者の行動指針を示し、ユーザーに対して運営方針・責任の所在を示すこと","フォロワー数を自動的に増やす仕組みを構築すること","SNS上のすべてのコメントに返信することを義務付けること"],"correct":[1],"explain":"ソーシャルメディアポリシーは、アカウント運営者である社員の行動指針を示すことと、ユーザーに対して運営方針・責任の所在を示すことを目的としています。"},{"id":"q12","type":"multi","sectionIndex":6,"question":"Googleがローカル検索の評価要素として公式に挙げている3つとして、正しいものをすべて選べ。","options":["関連性（Relevance）","距離（Distance）","知名度（Prominence）","従業員数（Employee Count）"],"correct":[0,1,2],"explain":"Googleはローカル検索の評価要素として、関連性・距離・知名度の3つを公式に挙げています。従業員数は評価要素ではありません。"},{"id":"q13","type":"single","sectionIndex":6,"question":"「MEO」という言葉についての説明として、最も適切なものはどれか。","options":["Google公式が定めた正式な専門用語である","日本国内で使われている通称で、一般的にはGoogleマップ上での上位表示に特化した施策を指す","ローカルSEOとは全く無関係の、別分野の用語である","MEOはローカルSEOよりも対象範囲が広い、上位概念である"],"correct":[1],"explain":"MEOはGoogle公式の用語ではなく、日本国内で使われている通称です。一般的にGoogleマップ上での上位表示に特化した施策を指し、ローカルSEOの一部と捉えられます。"}]
