[{"id":"q1","type":"single","sectionIndex":0,"question":"指名検索の説明として、最も適切なものはどれか。","options":["「SEO とは」のような一般的な情報を調べる検索","企業名やブランド名、商品名など固有名詞で検索されること","検索エンジンが自動的に生成する検索キーワード","広告経由でのみ発生する検索"],"correct":[1],"explain":"指名検索とは、企業名やブランド名、商品名など特定の固有名詞で検索されることを指します。"},{"id":"q2","type":"single","sectionIndex":0,"question":"指名検索が増えることの意味として、最も適切なものはどれか。","options":["指名検索の増減は、ブランドの認知度とは一切関係がない","ブランドの認知度が広がっていることの表れと考えられる","指名検索は必ずSEO施策だけによって増減する","指名検索が増えると、サイトのサーバー費用が自動的に下がる"],"correct":[1],"explain":"指名検索が増えることは、SEO施策だけでなく広告・PR・SNSなど幅広い活動の結果として、ブランドの認知度が広がっていることの表れと考えられます。"},{"id":"q3","type":"single","sectionIndex":1,"question":"サイテーションと被リンクの違いとして、最も適切なものはどれか。","options":["サイテーションと被リンクは全く同じものである","サイテーションはクリック可能なリンクがなくても、名前の言及だけで成立する","被リンクはリンクがなくても成立し、サイテーションは必ずリンクが必要である","サイテーションは被リンクの別の呼び方にすぎない"],"correct":[1],"explain":"サイテーションは、クリック可能なリンクが付いていなくても、名前の言及だけで成立する点が被リンクとの決定的な違いです。"},{"id":"q4","type":"single","sectionIndex":1,"question":"サイテーションとウェブ検索のランキングの関係について、最も適切な説明はどれか。","options":["Googleはサイテーションをウェブ検索の正式なランキング要因であると明確に公言している","Googleはサイテーションをウェブ検索のランキング要因として明確にはしていない","サイテーションは検索順位に一切何の影響も与えないとGoogleが断言している","サイテーションという概念自体、Googleとは無関係である"],"correct":[1],"explain":"Googleは被リンクをランキング要因として位置づけていますが、サイテーションについてはウェブ検索のランキング要因であると明確にはしていません。"},{"id":"q5","type":"single","sectionIndex":1,"question":"レビューやSNSでの言及とE-E-A-Tの関係についての説明として、最も適切なものはどれか。","options":["レビューやSNSでの言及は、E-E-A-Tとは一切関係がない","多くのユーザーから言及・評価されていることは、信頼性の材料の一つになりうると考えられる","レビューの数が多いほど、必ず検索順位が1位になることが保証される","SNSでの言及は、常にネガティブな影響しか与えない"],"correct":[1],"explain":"多くのユーザーから言及・評価されている企業・商品は、第三者による評価という点で、E-E-A-Tの信頼性の材料の一つになりうると考えられます。"},{"id":"q6","type":"multi","sectionIndex":2,"question":"Googleがローカル検索の評価要素として公式に挙げている3つとして、正しいものをすべて選べ。","options":["関連性（Relevance）","距離（Distance）","知名度（Prominence）","従業員数（Employee Count）"],"correct":[0,1,2],"explain":"Googleはローカル検索の評価要素として、関連性・距離・知名度の3つを公式に挙げています。従業員数は評価要素ではありません。"},{"id":"q7","type":"single","sectionIndex":2,"question":"「MEO」という言葉についての説明として、最も適切なものはどれか。","options":["Google公式が定めた正式な専門用語である","日本国内で使われている通称で、一般的にはGoogleマップ上での上位表示に特化した施策を指す","ローカルSEOとは全く無関係の、別分野の用語である","MEOはローカルSEOよりも対象範囲が広い、上位概念である"],"correct":[1],"explain":"MEOはGoogle公式の用語ではなく、日本国内で使われている通称です。一般的にGoogleマップ上での上位表示に特化した施策を指し、ローカルSEOの一部と捉えられます。"}]
