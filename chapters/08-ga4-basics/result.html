[{"id":"q1","type":"single","sectionIndex":0,"question":"GA4における「イベント」の説明として、最も適切なものはどれか。","options":["一定期間の訪問をまとめて区切る、最上位の集計単位","ページ閲覧やクリックなど、ユーザーの操作・行動を計測する基本単位","1人のユーザーの複数回の訪問をまとめた単位","目標達成として特別に指定した、重要な行動だけを指す単位"],"correct":[1],"explain":"GA4のイベントはユーザー行動を計測する基本単位です。セッション（訪問のまとまり）やユーザー、キーイベント（重要行動）と混同しないよう注意します。"},{"id":"q2","type":"multi","sectionIndex":0,"question":"GA4のイベントの種類として、正しいものをすべて選べ。","options":["自動収集イベント","拡張計測機能イベント","推奨イベント","広告専用イベント"],"correct":[0,1,2],"explain":"GA4のイベントは自動収集・拡張計測機能・推奨・カスタムの4種類に分類されます。「広告専用イベント」という分類はありません。"},{"id":"q3","type":"single","sectionIndex":0,"question":"「page_view（ページ表示）」が属するイベントの種類として、最も適切なものはどれか。","options":["カスタムイベント（独自に実装が必要）","推奨イベント（実装が必要）","自動収集イベント（タグ設置だけで収集される）","GA4では計測できないイベント"],"correct":[2],"explain":"page_view（ページ表示）は、GA4のタグを設置するだけで自動的に収集される自動収集イベントの代表例です。"},{"id":"q4","type":"single","sectionIndex":1,"question":"GA4における「キーイベント」の説明として、最も適切なものはどれか。","options":["サイトに初めて訪れた新規ユーザーの数","自動収集イベントのうち、page_viewだけを指す呼称","1セッション内で発生したすべてのイベントの合計数","ビジネス上とくに重要だと指定したイベント（旧コンバージョン）"],"correct":[3],"explain":"キーイベントは、ビジネス上重要な行動として指定したイベント（旧コンバージョン）です。新規ユーザー数やイベント総数とは異なります。"},{"id":"q5","type":"single","sectionIndex":1,"question":"GA4のキーイベントのカウント方法に関する注意点として、最も適切なものはどれか。","options":["イベントが発生するたびにカウントされるため、セッション数・ユーザー数との違いを意識する必要がある","1人のユーザーにつき、1日1回しかカウントされない","キーイベントは自動的にはカウントされず、手作業で集計する必要がある","キーイベントの数値は常にセッション数と完全に一致する"],"correct":[0],"explain":"GA4のキーイベントはイベントが発生するたびにカウントされるため、同じユーザーが同じ行動を複数回行うとカウントが増えることがあります。セッション数・ユーザー数との違いを意識することが重要です。"}]
