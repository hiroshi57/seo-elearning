[{"id":"q1","type":"single","sectionIndex":0,"question":"「エンティティ」の説明として、最も適切なものはどれか。","options":["検索クエリに含まれる個々の単語（キーワード）そのもの","1つのWebページに割り当てられる固有のURL","人・組織・場所・商品・作品など、明確に識別できる「実体」を指す概念","検索結果に表示されるページのタイトルリンク"],"correct":[2],"explain":"エンティティは人・組織・場所・商品などの「実体」を指します。単語・URL・タイトルリンクとは異なる概念です。"},{"id":"q2","type":"single","sectionIndex":0,"question":"Googleのナレッジグラフの説明として、最も適切なものはどれか。","options":["サイトの表示速度を計測するツール","広告費の予算を自動配分するシステム","ユーザーの検索履歴だけを記録する機能","人・組織・場所・作品などのエンティティと、それらの関係性を保持するデータベースの仕組み"],"correct":[3],"explain":"ナレッジグラフは、人・組織・場所・作品などのエンティティとその関係性を保持するGoogleのデータベースの仕組みです。"},{"id":"q3","type":"single","sectionIndex":0,"question":"Google公式ヘルプによる、ナレッジパネルの情報源についての説明として、最も適切なものはどれか。","options":["公開されている情報源や、Googleがライセンス契約を結んでいるデータ提供元など、さまざまな情報源から収集される","情報はすべてサイト運営者が直接入力したものだけである","ナレッジパネルには情報源という概念が存在しない","情報源は必ず1つのウェブサイトに限定される"],"correct":[0],"explain":"Google公式ヘルプによれば、ナレッジパネルの事実情報は、公開されている情報源やGoogleとライセンス契約を結んだデータ提供元など、さまざまな情報源から収集されます。"},{"id":"q4","type":"single","sectionIndex":1,"question":"自社がエンティティとして正しく認識されるための考え方として、最も適切なものはどれか。","options":["基本情報は掲載先ごとに表記がバラバラでも問題ない","会社名・所在地・提供サービスなどの基本情報を、公式サイトやSNSなどで一貫させる","情報を一切公開しないほうが、エンティティとして認識されやすい","SNSアカウントは作らず、公式サイトだけに情報をまとめる"],"correct":[1],"explain":"各所での情報の一貫性が、エンティティとして正しく認識される鍵です。表記のばらつきや情報の非公開はマイナスに働きます。"},{"id":"q5","type":"single","sectionIndex":1,"question":"ナレッジパネルの情報に誤りがある場合の対応として、Google公式ヘルプが示している方法はどれか。","options":["誤りがあっても、修正を申し出る手段は一切用意されていない","情報の修正には、必ず費用の支払いが必要である","本人・正式な代表者はフィードバック手段から、それ以外もフィードバックリンクから編集内容を提案できる","ナレッジパネルの情報は一度表示されると絶対に変更できない"],"correct":[2],"explain":"本人・正式な代表者は専用のフィードバック手段から、それ以外の場合もナレッジパネル上のフィードバックリンクから編集内容を提案できます。"}]
