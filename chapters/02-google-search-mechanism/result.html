  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"クローリング（Crawling）の説明として、最も適切なものはどれか。","options":["検索エンジンのロボットがリンクやサイトマップをたどってWebページを発見・巡回し、内容を収集するプロセス","収集済みのページ内容を解析し、検索用データベースに登録・整理するプロセス","検索クエリとの関連性を計算し、表示する順位を決めるプロセス","取得できなかったURLに対して、代替ページを自動生成するプロセス"],"correct":[0],"explain":"クローリングはロボットがページを発見・巡回して収集する工程です。B（登録・整理）はインデックス、C（順位付け）はランキングの説明で、混同しやすい選択肢です。"},{"id":"q2","type":"single","sectionIndex":1,"question":"「クロールはされたが、インデックスはされていない」ページについての説明として、正しいものはどれか。","options":["クロール済みであれば、インデックス前でも検索結果に表示される","インデックスされていないため、検索結果には表示されない","クロールとインデックスは同義のため、この状態は発生しない","インデックス前のページは、インデックス済みページより上位に表示される"],"correct":[1],"explain":"検索結果に表示されるにはインデックス登録が必要です。クロール（発見）とインデックス（登録）は別工程で、クロールされただけでは表示されません。"},{"id":"q3","type":"single","sectionIndex":2,"question":"Googleのランキングの仕組みに関する説明として、最も適切なものはどれか。","options":["被リンクの本数が最も多いページが、内容にかかわらず常に最上位になる","本文の文字数が多いページほど、機械的に上位に表示される","関連性・品質・有用性など、数多くのシグナルを組み合わせて総合的に順位が決まる","更新日時が最も新しいページが、内容にかかわらず常に上位になる"],"correct":[2],"explain":"ランキングは単一の指標ではなく、多数のシグナルの組み合わせで決まります。被リンク数・文字数・更新日時などの単一要素だけで順位が決まるわけではありません。"},{"id":"q4","type":"multi","sectionIndex":3,"question":"Google Search Centralで紹介されている、検索クエリの意図理解に使われるシステムとして、正しいものをすべて選べ。","options":["ニューラルマッチング","BERT","RankBrain","PageRank（リンクによる評価を扱う仕組み）"],"correct":[0,1,2],"explain":"RankBrain・BERT・ニューラルマッチングは検索クエリの意図・文脈理解に関わる仕組みです。PageRankはリンクによる評価の仕組みで、意図理解のシステムではありません。"},{"id":"q5","type":"multi","sectionIndex":4,"question":"検索意図の分類として、一般的に使われているものをすべて選べ。","options":["Do（したい）","Go（行きたい）","Know（知りたい）","Sell（売りたい）","Buy（買いたい）"],"correct":[0,1,2,4],"explain":"一般に使われる分類はKnow・Do・Go・Buyの4つです。『Sell（売りたい）』は含まれません（Buyとの取り違えに注意）。"},{"id":"q6","type":"single","sectionIndex":4,"question":"「〇〇株式会社 公式サイト」という検索クエリが該当する検索意図の分類として、最も適切なものはどれか。","options":["Know（知りたい）","Do（したい）","Buy（買いたい）","Go（行きたい）"],"correct":[3],"explain":"特定のサイトや場所に到達したいという指名検索は「Go（行きたい）」クエリに分類されます。"},{"id":"q7","type":"single","sectionIndex":5,"question":"Website queryとVisit-in-Person queryの違いに関する説明として、最も適切なものはどれか。","options":["Website queryは特定の1サイトを、Visit-in-Person queryは近くの特定ジャンルの複数店舗・施設を探している","Website queryは公式サイトを、Visit-in-Person queryはSNSアカウントを探すクエリである","Visit-in-Person queryはモバイル検索専用で、Website queryはPC検索専用である","Visit-in-Person queryは購入意欲が最も高いBuyクエリと同じ意味である"],"correct":[0],"explain":"Website queryは1つに特定されるサイト、Visit-in-Person queryは近隣の複数店舗・施設を探すクエリです。デバイス限定やBuyと同義といった説明は誤りです。"},{"id":"q8","type":"single","sectionIndex":5,"question":"ゼロクリック検索（Zero-click Search）の説明として、最も適切なものはどれか。","options":["検索結果にオーガニックのページが1件も表示されない状態のこと","検索結果ページ上で疑問が解決し、ユーザーがどのサイトもクリックしないまま検索が完結すること","広告を避けてオーガニック検索結果だけをクリックするユーザー行動のこと","クリック課金広告で、クリックが発生せず費用がかからない状態のこと"],"correct":[1],"explain":"ゼロクリック検索は、強調スニペットやAI Overviewなどで検索結果画面上だけで疑問が解決し、サイトに遷移しないまま完結する現象を指します。"},{"id":"gq_exclude","type":"single","sectionIndex":0,"question":"特定のページをGoogleの検索結果に表示させたくない場合の対応として、ガイドの記述に最も適切なものはどれか。","options":["title要素を空にしてインデックスから外す","ページを一時的にサーバーエラー（5xx）にし続ける","robots.txt での不許可や noindex など、適切な方法でクロール/インデックスを制御する","そのページへの内部リンクをすべて外す"],"correct":[2],"explain":"表示したくないページは robots.txt でのブロックや noindex など、目的に応じた適切な方法で制御します。リンクを外す・title空・エラー化などは確実な除外方法ではありません。（スターターガイド『Googleの検索結果から除外したい場合』）"}]
