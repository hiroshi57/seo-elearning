[{"id":"q1","type":"single","sectionIndex":0,"question":"クローリング（Crawling）の説明として、最も適切なものはどれか。","options":["検索結果に表示するページの順位を決めるプロセス","検索エンジンのロボットがWebページを発見・巡回し、内容を収集するプロセス","ユーザーが入力した検索キーワードを解析するプロセス","ページの表示速度を計測するプロセス"],"correct":[1],"explain":"クローリングは検索エンジン（クローラー）がWebページを発見・巡回し、内容を収集する最初のプロセスです。"},{"id":"q2","type":"single","sectionIndex":1,"question":"「クロールはされたが、インデックスはされていない」ページについての説明として、正しいものはどれか。","options":["検索結果には表示されない","検索結果に必ず1位で表示される","クロールされていないページより優先的に表示される","インデックスの有無は検索結果の表示に影響しない"],"correct":[0],"explain":"インデックスに登録されて初めて検索結果に表示される対象になります。クロールされてもインデックスされなければ表示されません。"},{"id":"q3","type":"single","sectionIndex":2,"question":"Googleのランキングの仕組みに関する説明として、最も適切なものはどれか。","options":["たった1つの指標だけで検索順位がすべて決まる","関連性・品質・有用性など、数多くのシグナルを組み合わせて順位が決まる","ページの公開日が新しいページが常に最上位に表示される","広告費を支払ったページが自動的に自然検索結果の1位になる"],"correct":[1],"explain":"Googleのランキングは単一の指標ではなく、関連性・品質・ユーザーにとっての有用性など多数のシグナルを組み合わせて決定される仕組みです。"},{"id":"q4","type":"multi","sectionIndex":3,"question":"Google Search Centralで紹介されている、検索クエリの意図理解に使われるシステムとして、正しいものをすべて選べ。","options":["RankBrain","BERT","Core Web Vitals","XMLサイトマップ"],"correct":[0,1],"explain":"RankBrainとBERTは、検索クエリの意図や文脈の理解を助けるAIシステムです。Core Web VitalsとXMLサイトマップは意図理解の仕組みとは異なります。"},{"id":"q5","type":"multi","sectionIndex":4,"question":"検索意図の分類として、一般的に使われているものをすべて選べ。","options":["Know（知りたい）","Do（したい）","Go（行きたい）","Sell（売りたい）"],"correct":[0,1,2],"explain":"検索意図はKnow（知りたい）・Do（したい）・Go（行きたい）・Buy（買いたい）の4分類で考えるのが一般的です。「Sell（売りたい）」はユーザー側ではなく提供者側の意図であり、検索意図の分類には含まれません。"},{"id":"q6","type":"single","sectionIndex":4,"question":"「〇〇株式会社 公式サイト」という検索クエリが該当する検索意図の分類として、最も適切なものはどれか。","options":["Know（知りたい）","Do（したい）","Go（行きたい）","Buy（買いたい）"],"correct":[2],"explain":"特定のサイトや場所に到達したいという指名検索は「Go（行きたい）」クエリに分類されます。"}]
