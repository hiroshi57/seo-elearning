  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"multi","sectionIndex":0,"question":"検索パフォーマンスレポートに表示される指標として、正しいものをすべて選べ。","options":["クリック数","表示回数（インプレッション数）","平均掲載順位","サイトの月間サーバー費用"],"correct":[0,1,2],"explain":"検索パフォーマンスレポートには、クリック数・表示回数・CTR・平均掲載順位の4指標が表示されます。サーバー費用のような会計情報は含まれません。"},{"id":"q2","type":"single","sectionIndex":0,"question":"CTR（クリック率）の説明として、最も適切なものはどれか。","options":["サイトの表示速度を示す指標","クリック数を表示回数で割った値","検索結果に表示された広告の数","インデックスに登録されたページの総数"],"correct":[1],"explain":"CTR（クリック率）は、クリック数を表示回数（インプレッション数）で割った値です。"},{"id":"q3","type":"single","sectionIndex":0,"question":"ゼロクリックサーチの説明として、最も適切なものはどれか。","options":["検索結果に一切表示されなくなる現象","ユーザーがAI Overviewやスニペットだけで満足し、ページへ遷移しないケースが増えている現象","サイトの表示速度が0秒になる現象","検索エンジンがクロールを完全に停止する現象"],"correct":[1],"explain":"ゼロクリックサーチとは、ユーザーがAI Overviewや検索結果のスニペットだけで満足し、実際にはページへ遷移しないケースが増えている現象です。掲載順位が変わらなくてもCTRが下がる一因になります。"},{"id":"q4","type":"single","sectionIndex":1,"question":"「表示回数は多いが、CTRが低い」ページに対する改善の方向性として、最も適切なものはどれか。","options":["サーバーのスペックを上げる","タイトルやディスクリプション（スニペット）を見直す","そのページを検索結果から完全に除外する","何も対応する必要はない"],"correct":[1],"explain":"表示回数は多いのにクリックされにくい場合、検索結果に表示されるタイトルやディスクリプションに改善の余地があるサインと考えられます。"},{"id":"q5","type":"single","sectionIndex":2,"question":"「検出 - インデックス未登録」の状態の説明として、最も適切なものはどれか。","options":["ページがすでに検索結果の1位に表示されている状態","Googleにページの存在は発見されたが、まだクロールされていない状態","サイト運営者がページを削除した状態","そのページには一切アクセスできない状態"],"correct":[1],"explain":"「検出 - インデックス未登録」は、Googleがページの存在を発見したものの、まだクロールが行われていない状態を指します。"},{"id":"q6","type":"single","sectionIndex":2,"question":"重要なページが意図せず「除外」に分類されていた場合の対応として、最も適切なものはどれか。","options":["特に何もせず放置してよい","原因を特定し、URL検査ツールなども併用して個別に状態を確認する","サイト全体をゼロから作り直す","除外は元に戻せないため諦める"],"correct":[1],"explain":"重要なページが除外されている場合は、原因を特定し、URL検査ツールなどを使って個別にページの状態を詳しく確認して対処する必要があります。"},{"id":"q7","type":"single","sectionIndex":3,"question":"検索からCVまでのファネルの流れとして、最も適切なものはどれか。","options":["CV数 → クリック数 → 表示回数 → 検索ボリューム","検索ボリューム → 表示回数 → クリック数（流入） → CV数","表示回数とCV数には、いかなる関係もない","検索ボリュームはSEOのモニタリングには不要な指標である"],"correct":[1],"explain":"SEOにおける検索からCVまでの流れは、検索ボリュームを起点に、表示回数、クリック数（流入）、CV数へと絞り込まれていくファネルの形状で捉えられます。"},{"id":"q8","type":"single","sectionIndex":3,"question":"「UU価値」「CV価値」を追うことの意義として、最も適切なものはどれか。","options":["CV数だけを見ていては気付けない、売上・利益とのつながりを把握できる","サーバー費用を正確に計算するために使う指標である","UU価値やCV価値はSEOの評価とは無関係である","CV数さえ増えていれば、他の指標を確認する必要はない"],"correct":[0],"explain":"UU価値・CV価値は1UU・1CVあたりの売上や利益を示す指標で、CV数だけを追っていては気付けない「流入は増えているが売上につながっていない」といった問題を発見する手がかりになります。"},{"id":"q9","type":"single","sectionIndex":4,"question":"検索順位の変動を分析する際の考え方として、最も適切なものはどれか。","options":["1日でも順位が下がったら、即座にページを全面的に作り直すべきである","自サイトのみの変動か、競合を含めた全体的な変動かを見極め、短期的な変化と長期的な傾向を区別して分析する","Googleはアルゴリズムを更新しないため、順位が変動することはない","順位変動の原因は、常にコンテンツの品質低下のみである"],"correct":[1],"explain":"順位変動を分析する際は、自サイトのみの変動か競合も含めた全体的な変動かを見極め、短期的なノイズと長期的な傾向を区別することが重要です。全体的な変動はアルゴリズムの変更が疑われます。"},{"id":"q10","type":"single","sectionIndex":4,"question":"検索結果画面（SERPs）を定期的にキャプチャして保存しておくことの利点として、最も適切なものはどれか。","options":["サーバーの保存容量を減らすことができる","後から順位変動の要因（検索意図の変化やSERPs要素の変化など）を分析する手がかりになる","キャプチャを保存すると、自動的に検索順位が上昇する","Search Consoleのデータ保持期間が無制限になる"],"correct":[1],"explain":"検索結果画面を定期的にキャプチャし保存しておくことで、単なる順位の数値だけでは分からない、検索意図やSERPs要素の変化を後から振り返って分析する手がかりになります。"}]
