[{"id":"q1","type":"multi","sectionIndex":0,"question":"検索パフォーマンスレポートに表示される指標として、正しいものをすべて選べ。","options":["クリック数","表示回数（インプレッション数）","平均掲載順位","サイトの月間サーバー費用"],"correct":[0,1,2],"explain":"検索パフォーマンスレポートには、クリック数・表示回数・CTR・平均掲載順位の4指標が表示されます。サーバー費用のような会計情報は含まれません。"},{"id":"q2","type":"single","sectionIndex":0,"question":"CTR（クリック率）の説明として、最も適切なものはどれか。","options":["サイトの表示速度を示す指標","クリック数を表示回数で割った値","検索結果に表示された広告の数","インデックスに登録されたページの総数"],"correct":[1],"explain":"CTR（クリック率）は、クリック数を表示回数（インプレッション数）で割った値です。"},{"id":"q3","type":"single","sectionIndex":0,"question":"ゼロクリックサーチの説明として、最も適切なものはどれか。","options":["検索結果に一切表示されなくなる現象","ユーザーがAI Overviewやスニペットだけで満足し、ページへ遷移しないケースが増えている現象","サイトの表示速度が0秒になる現象","検索エンジンがクロールを完全に停止する現象"],"correct":[1],"explain":"ゼロクリックサーチとは、ユーザーがAI Overviewや検索結果のスニペットだけで満足し、実際にはページへ遷移しないケースが増えている現象です。掲載順位が変わらなくてもCTRが下がる一因になります。"},{"id":"q4","type":"single","sectionIndex":1,"question":"「表示回数は多いが、CTRが低い」ページに対する改善の方向性として、最も適切なものはどれか。","options":["サーバーのスペックを上げる","タイトルやディスクリプション（スニペット）を見直す","そのページを検索結果から完全に除外する","何も対応する必要はない"],"correct":[1],"explain":"表示回数は多いのにクリックされにくい場合、検索結果に表示されるタイトルやディスクリプションに改善の余地があるサインと考えられます。"},{"id":"q5","type":"single","sectionIndex":2,"question":"「検出 - インデックス未登録」の状態の説明として、最も適切なものはどれか。","options":["ページがすでに検索結果の1位に表示されている状態","Googleにページの存在は発見されたが、まだクロールされていない状態","サイト運営者がページを削除した状態","そのページには一切アクセスできない状態"],"correct":[1],"explain":"「検出 - インデックス未登録」は、Googleがページの存在を発見したものの、まだクロールが行われていない状態を指します。"},{"id":"q6","type":"single","sectionIndex":2,"question":"重要なページが意図せず「除外」に分類されていた場合の対応として、最も適切なものはどれか。","options":["特に何もせず放置してよい","原因を特定し、URL検査ツールなども併用して個別に状態を確認する","サイト全体をゼロから作り直す","除外は元に戻せないため諦める"],"correct":[1],"explain":"重要なページが除外されている場合は、原因を特定し、URL検査ツールなどを使って個別にページの状態を詳しく確認して対処する必要があります。"}]
