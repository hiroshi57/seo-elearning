  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"検索ボリュームの説明として、最も適切なものはどれか。","options":["そのキーワードで上位表示されているサイトの数","特定のキーワードが一定期間に検索された回数の目安","検索結果ページに表示される広告の数","サイトの表示速度を数値化した指標"],"correct":[1],"explain":"検索ボリュームは、特定のキーワードが一定期間（多くの場合1ヶ月）に検索された回数の目安を示す指標です。"},{"id":"q2","type":"single","sectionIndex":1,"question":"「SEO 対策 やり方」というキーワードに対応する検索意図として、最も適切なものはどれか。","options":["Know（知りたい）","Go（行きたい）","Do（したい）","検索意図は考える必要がない"],"correct":[2],"explain":"「やり方」は特定の行動・作業を行いたいという意図を示すため、Do（したい）クエリに該当します。"},{"id":"q2b","type":"single","sectionIndex":2,"question":"「軸キーワード」の説明として、最も適切なものはどれか。","options":["検索意図が最も限定された、複数語からなるキーワード","競合サイトだけが使用しているキーワード","検索ボリュームが常にゼロのキーワード","自社にとって重要かつ関連性が最も高い、検索意図の幅が広い単一のキーワード"],"correct":[3],"explain":"軸キーワードは、自社にとって重要かつ関連性が最も高い、検索意図の幅が広い単一のキーワードです。ここから関連キーワードを網羅的に広げていきます。"},{"id":"q2c","type":"multi","sectionIndex":2,"question":"軸キーワードからキーワードを広げる方法として、正しいものをすべて選べ。","options":["Googleキーワードプランナーなどの関連キーワードツールを活用する","サジェストキーワード（オートコンプリート）を収集する","軸キーワードと関係のないキーワードだけをあえて優先的に集める","自社サイトの流入キーワードや競合サイトの対策キーワードを確認する"],"correct":[0,1,3],"explain":"サジェストキーワードの収集、関連キーワードツールの活用、自社の流入キーワードや競合の対策キーワードの確認は、いずれもキーワードを網羅的に広げるための有効な方法です。"},{"id":"q2d","type":"single","sectionIndex":3,"question":"キーワードの「グルーピング」の目的として、最も適切なものはどれか。","options":["同じニーズを表すキーワード同士をまとめ、ニーズごとの大きさを正しく把握するため","検索ボリュームが大きい順にキーワードを並べるだけで十分なので、グルーピングは不要である","検索エンジンにキーワードを大量に送信し、インデックスを促進するため","競合サイトのキーワードをすべて自社サイトのタイトルに含めるため"],"correct":[0],"explain":"同一のニーズでも異なる表現のキーワードで検索されることが多いため、グルーピングによってニーズごとの検索ボリュームを正しく把握できるようになります。"},{"id":"q2e","type":"single","sectionIndex":3,"question":"「想起度」を軸にしたユーザー層の分類のうち、最も行動意欲が高いとされる層はどれか。","options":["潜在ユーザー","指名検索ユーザー","ニーズ顕在ユーザー","手段顕在ユーザー"],"correct":[1],"explain":"指名検索ユーザーは自社の商品名・ブランド名で検索しており、想起度・行動意欲がともに最も高い層とされています。"},{"id":"q3","type":"multi","sectionIndex":4,"question":"トピッククラスターの考え方として、正しいものをすべて選べ。","options":["クラスターページはピラーページと一切関連付けてはならない","ピラーページはトピック全体を網羅的に扱う中心的なページである","クラスターページはピラーページの中の具体的なサブテーマを扱う","ピラーページとクラスターページは内部リンクでつなげる"],"correct":[1,2,3],"explain":"トピッククラスターは、ピラーページ（網羅的な中心ページ）とクラスターページ（具体的なサブテーマのページ）を内部リンクでつなげる設計手法です。"},{"id":"q4","type":"single","sectionIndex":4,"question":"ロングテールキーワードの特徴として、最も適切なものはどれか。","options":["1語のみで構成され、検索ボリュームが非常に大きい","検索エンジンには一切認識されないキーワード","2語・3語以上を組み合わせた具体的なキーワードで、検索意図が明確な傾向がある","必ず商品名だけで構成されるキーワード"],"correct":[2],"explain":"ロングテールキーワードは複数語を組み合わせた具体的なキーワードで、検索意図が明確になりやすく、競合が少ない傾向があります。"},{"id":"q5","type":"single","sectionIndex":5,"question":"SEOにおける「競合」の考え方として、最も適切なものはどれか。","options":["常に自社と同じ業界・業種の企業のみが競合になる","競合は分析する必要がなく、自社の施策だけを考えればよい","検索結果に表示されないサイトほど強い競合である","対策したいキーワードで実際に上位表示されているサイトを競合として捉える"],"correct":[3],"explain":"SEOの競合分析では、ビジネス上のライバル企業とは限らず、「対策したいキーワードで実際に上位表示されているサイト」を競合として見るのが基本的な考え方です。"},{"id":"q5b","type":"single","sectionIndex":5,"question":"Googleのsite:コマンドに関する説明として、最も適切なものはどれか。","options":["site:ドメインの形式で検索すると、そのドメイン内でインデックス登録されているURLの一覧を確認する手がかりになる","site:コマンドを使うと、競合サイトの正確な検索順位が分かる","site:コマンドはリスティング広告の入札額を調べるための機能である","site:コマンドは有料ツールでしか利用できない"],"correct":[0],"explain":"site:コマンドは「site:ドメイン」の形式で検索することで、そのドメインでインデックス登録されているURLの一覧を確認できる、Googleの検索演算子です。正確なインデックス数と完全に一致するわけではありませんが、競合サイトの規模を把握する手がかりになります。"}]
