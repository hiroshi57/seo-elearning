  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"検索ボリュームの説明として、最も適切なものはどれか。","options":["特定のキーワードが一定期間に検索された回数の目安","そのキーワードで上位表示されているサイトの数","検索結果ページに表示される広告の数","サイトの表示速度を数値化した指標"],"correct":[0],"explain":"検索ボリュームは、特定のキーワードが一定期間（多くの場合1ヶ月）に検索された回数の目安を示す指標です。"},{"id":"q2","type":"single","sectionIndex":1,"question":"「SEO 対策 やり方」というキーワードに対応する検索意図として、最も適切なものはどれか。","options":["Know（知りたい）","Do（したい）","Go（行きたい）","検索意図は考える必要がない"],"correct":[1],"explain":"「やり方」は特定の行動・作業を行いたいという意図を示すため、Do（したい）クエリに該当します。"},{"id":"q3","type":"multi","sectionIndex":2,"question":"トピッククラスターの考え方として、正しいものをすべて選べ。","options":["ピラーページはトピック全体を網羅的に扱う中心的なページである","クラスターページはピラーページの中の具体的なサブテーマを扱う","ピラーページとクラスターページは内部リンクでつなげる","クラスターページはピラーページと一切関連付けてはならない"],"correct":[0,1,2],"explain":"トピッククラスターは、ピラーページ（網羅的な中心ページ）とクラスターページ（具体的なサブテーマのページ）を内部リンクでつなげる設計手法です。"},{"id":"q4","type":"single","sectionIndex":2,"question":"ロングテールキーワードの特徴として、最も適切なものはどれか。","options":["1語のみで構成され、検索ボリュームが非常に大きい","2語・3語以上を組み合わせた具体的なキーワードで、検索意図が明確な傾向がある","検索エンジンには一切認識されないキーワード","必ず商品名だけで構成されるキーワード"],"correct":[1],"explain":"ロングテールキーワードは複数語を組み合わせた具体的なキーワードで、検索意図が明確になりやすく、競合が少ない傾向があります。"},{"id":"q5","type":"single","sectionIndex":3,"question":"SEOにおける「競合」の考え方として、最も適切なものはどれか。","options":["常に自社と同じ業界・業種の企業のみが競合になる","対策したいキーワードで実際に上位表示されているサイトを競合として捉える","競合は分析する必要がなく、自社の施策だけを考えればよい","検索結果に表示されないサイトほど強い競合である"],"correct":[1],"explain":"SEOの競合分析では、ビジネス上のライバル企業とは限らず、「対策したいキーワードで実際に上位表示されているサイト」を競合として見るのが基本的な考え方です。"}]
