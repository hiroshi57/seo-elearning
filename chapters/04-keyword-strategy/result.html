  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"検索ボリュームの説明として、最も適切なものはどれか。","options":["そのキーワードで上位表示されている競合サイトの数","特定のキーワードが一定期間に検索エンジンで検索された回数の目安","検索結果ページに表示される広告枠の数","そのキーワードでの上位表示の難易度をGoogleが公式に数値化した指標"],"correct":[1],"explain":"検索ボリュームは検索された回数の目安です。競合数や広告枠数ではなく、また『難易度』は各ツールの推定値でGoogle公式の数値ではありません。"},{"id":"q2","type":"single","sectionIndex":1,"question":"「SEO 対策 やり方」というキーワードに対応する検索意図として、最も適切なものはどれか。","options":["Know（知りたい）","Go（行きたい）","Do（したい）","検索意図は考える必要がない"],"correct":[2],"explain":"「やり方」は特定の行動・作業を行いたいという意図を示すため、Do（したい）クエリに該当します。"},{"id":"q2b","type":"single","sectionIndex":2,"question":"「軸キーワード」の説明として、最も適切なものはどれか。","options":["検索意図が最も限定された、複数語の組み合わせからなるキーワード","検索ボリュームが常にゼロに近い、ニッチなキーワード","自社では対策せず、競合の動向確認だけに使うキーワード","自社にとって重要かつ関連性が高い、検索意図の幅が広い単一のキーワード"],"correct":[3],"explain":"軸キーワードは検索意図の幅が広い単一のキーワードです。複数語で意図が限定されたものはロングテール寄りで、軸キーワードとは異なります。"},{"id":"q2c","type":"multi","sectionIndex":2,"question":"軸キーワードからキーワードを広げる方法として、正しいものをすべて選べ。","options":["Googleキーワードプランナーなどの関連キーワードツールを活用する","サジェストキーワード（オートコンプリート）を収集する","軸キーワードと関係のないキーワードだけをあえて優先的に集める","自社サイトの流入キーワードや競合サイトの対策キーワードを確認する"],"correct":[0,1,3],"explain":"サジェストキーワードの収集、関連キーワードツールの活用、自社の流入キーワードや競合の対策キーワードの確認は、いずれもキーワードを網羅的に広げるための有効な方法です。"},{"id":"q2d","type":"single","sectionIndex":3,"question":"キーワードの「グルーピング」の目的として、最も適切なものはどれか。","options":["同じニーズを表すキーワード同士をまとめ、ニーズごとの大きさを正しく把握するため","検索ボリュームの大きい順に並べれば十分なので、実際には不要な作業である","検索エンジンに大量のキーワードを送信し、インデックスを促進するため","競合サイトのキーワードを漏れなく自社のタイトルに含めるため"],"correct":[0],"explain":"グルーピングは同じニーズの表現を束ね、ニーズの大きさを正しく捉えるための作業です。単純なボリューム順では同一ニーズが分散し、正しく把握できません。"},{"id":"q2e","type":"single","sectionIndex":3,"question":"「想起度」を軸にしたユーザー層の分類のうち、最も行動意欲が高いとされる層はどれか。","options":["潜在ユーザー","指名検索ユーザー","ニーズ顕在ユーザー","手段顕在ユーザー"],"correct":[1],"explain":"指名検索ユーザーは自社の商品名・ブランド名で検索しており、想起度・行動意欲がともに最も高い層とされています。"},{"id":"q3","type":"multi","sectionIndex":4,"question":"トピッククラスターの考え方として、正しいものをすべて選べ。","options":["クラスターページはピラーページの中の具体的なサブテーマを扱う","ピラーページとクラスターページは内部リンクでつなげる","クラスターページはピラーページと一切関連付けてはならない","ピラーページはトピック全体を網羅的に扱う中心的なページである"],"correct":[0,1,3],"explain":"トピッククラスターは、ピラーページ（網羅的な中心ページ）とクラスターページ（具体的なサブテーマのページ）を内部リンクでつなげる設計手法です。"},{"id":"q4","type":"single","sectionIndex":4,"question":"ロングテールキーワードの特徴として、最も適切なものはどれか。","options":["1語のみで構成され、検索ボリュームが非常に大きいキーワード","検索ボリュームが大きいわりに、競合が常に存在しないキーワード","2語・3語以上を組み合わせた具体的なキーワードで、検索意図が明確な傾向がある","必ず商品名だけで構成される、指名検索のキーワード"],"correct":[2],"explain":"ロングテールは複数語からなる具体的なキーワードで、ボリュームは小さいものの意図が明確で競合も比較的弱い傾向があります。"},{"id":"q5","type":"single","sectionIndex":5,"question":"SEOにおける「競合」の考え方として、最も適切なものはどれか。","options":["自社と同じ業界・業種の企業だけが、常に競合になる","検索結果に表示されていないサイトほど、警戒すべき強い競合である","競合分析は不要で、自社の施策だけを考えれば十分である","対策したいキーワードで実際に上位表示されているサイトを競合として捉える"],"correct":[3],"explain":"SEOの競合は『対策キーワードで実際に上位表示されているサイト』です。比較サイトやメディアなど、業種の異なるサイトが競合になることもあります。"},{"id":"q5b","type":"single","sectionIndex":5,"question":"Googleのsite:コマンドに関する説明として、最も適切なものはどれか。","options":["site:ドメインの形式で検索し、そのドメインのインデックス状況やおおよその規模を把握する手がかりになる","そのドメインの正確なインデックス数と検索順位を確定的に取得できる","リスティング広告の入札額や品質スコアを調べるための機能である","有料のSEOツールを契約しないと使えない、Googleの専用機能である"],"correct":[0],"explain":"site:コマンドはインデックス状況や規模感を推測する手がかりで、正確な件数や順位が分かるわけではありません。無料で使え、広告の入札額とは無関係です。"}]
