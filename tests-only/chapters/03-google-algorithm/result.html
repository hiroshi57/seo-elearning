  <script type="application/json" data-quiz-data>
[{"id":"q0a","type":"single","sectionIndex":0,"question":"Googleの共同創業者Larry Page氏が述べたとされる「完璧な検索エンジン」の説明として、最も適切なものはどれか。","options":["できるだけ多くの検索結果を表示し、ユーザーに選ばせるエンジン","権威あるサイトのトップページだけを優先して返すエンジン","最も更新頻度が高いページを常に最上位に返すエンジン","ユーザーの意図を正確に把握し、そのニーズに一致するものを返すエンジン"],"correct":[3],"explain":"Larry Page氏の言葉として知られるのは「ユーザーの意図を正確に把握し、ニーズに一致するものを返す」エンジンです。表示量や更新頻度、トップページ優先などが本質ではありません。"},{"id":"q0b","type":"multi","sectionIndex":0,"question":"Googleの理念から整理される、SEOで取り組むべき3つのプロセスとして、正しいものをすべて選べ。","options":["求められている情報と、その背後にある意図を把握する","意図を過不足なく満たす、独自性・信頼性のある情報を用意する","検索エンジンや生成AIに正しく理解・参照される状態に構造を整える","検索エンジンを欺く手法で、短期間に順位を押し上げる"],"correct":[0,1,2],"explain":"SEOで取り組むべきプロセスは「意図の把握」「情報の用意」「構造の整備」の3つに整理できます。検索エンジンを欺く手法は、これらのいずれにも該当しません。"},{"id":"q1","type":"single","sectionIndex":1,"question":"コアアップデートの説明として、最も適切なものはどれか。","options":["検索結果全体の有用性・信頼性を高めることを目的とした、広範なアルゴリズム変更","ガイドライン違反のサイトへ個別に科される手動ペナルティ","サイト運営者が申請して受けられる、順位を引き上げる公式プログラム","毎月決まった日に必ず実施される、定例のインデックス更新"],"correct":[0],"explain":"コアアップデートは検索全体の有用性・信頼性を高めるための広範な変更で、特定サイトを狙う手動ペナルティや、申請制の順位向上策ではありません。実施時期も固定ではありません。"},{"id":"q2","type":"single","sectionIndex":1,"question":"コアアップデート後に自社サイトの順位が下がった場合の考え方として、最も適切なものはどれか。","options":["必ずガイドライン違反によるペナルティを受けたことを意味する","コンテンツの品質や有用性を見直す一つの機会と捉えるのが実務上の考え方である","Googleへ再審査（再評価）を申請すれば、すぐに順位が元に戻る","コアアップデートと順位変動の間には、因果関係は認められていない"],"correct":[1],"explain":"コアアップデート後の変動はペナルティではなく、品質・有用性を見直す機会と捉えます。再審査申請で即戻るものでもなく、変動と無関係でもありません。"},{"id":"q3","type":"multi","sectionIndex":2,"question":"Googleが「役立つコンテンツ」を判断する際に重視するとされる観点として、正しいものをすべて選べ。","options":["対策キーワードを本文にできる限り多く詰め込んでいるか","他のページには無い、独自の視点・データ・分析が含まれているか","検索するユーザーにとって本当に役立つ内容になっているか","専門知識を持つ人物・情報源によって作られているか"],"correct":[1,2,3],"explain":"独自性・ユーザーへの有用性・専門性が重視されます。キーワードの詰め込みは『検索エンジン向け（ユーザー不在）』の典型例で、むしろ避けるべき手法です。"},{"id":"q4","type":"single","sectionIndex":2,"question":"「検索品質評価ガイドライン」に関する説明として、正しいものはどれか。","options":["検索順位を自動的に決定するアルゴリズムそのものである","サイト運営者が自分のサイトを採点する公式スコアリングツールである","外部の評価者向けにGoogleが運用する内部マニュアルで、重視する品質の基準を知る手がかりになる","広告の審査だけに使われる、検索順位とは無関係の文書である"],"correct":[2],"explain":"検索品質評価ガイドラインは評価者向けの内部マニュアルで、順位を直接決めるアルゴリズムでも自己採点ツールでもありません。品質の考え方を知る手がかりになります。"},{"id":"q5","type":"single","sectionIndex":2,"question":"コンテンツの独自性に関するGoogleの考え方として、最も適切なものはどれか。","options":["他サイトの内容を過不足なく要約したコンテンツが最も高く評価される","独自性より、まず文章量（文字数）の多さが評価を左右する","独自性はユーザー向けの概念で、Googleの評価には関係しない","独自の視点・データ・分析を含むコンテンツは、品質評価において重視される傾向にある"],"correct":[3],"explain":"独自の視点・データ・分析を含むコンテンツが重視されます。他サイトの要約や単なる文字数の多さが高評価につながるわけではありません。"},{"id":"q6","type":"multi","sectionIndex":3,"question":"サイトの評価要素のうち「内部要素」に含まれるものとして、正しいものをすべて選べ。","options":["コンテンツがユーザーニーズを満たしているか","他サイトからの被リンクや、第三者による言及（サイテーション）","表示速度やモバイル対応が十分か","E-E-A-T（経験・専門性・権威性・信頼性）が担保されているか"],"correct":[0,2,3],"explain":"内部要素は自サイトでコントロールできる範囲（コンテンツ・E-E-A-T・表示速度など）です。他サイトからの被リンクやサイテーションは外部要素に分類されます。"},{"id":"q7","type":"single","sectionIndex":3,"question":"「外部要素」の評価において重視される点として、最も適切なものはどれか。","options":["どのような文脈・信頼性を持つサイトから参照されているか、という質的な側面","参照・言及された回数が多ければ多いほど、無条件に評価が高くなる","自作の別サイトから大量に相互リンクを送ることが最も有効な対策である","外部要素はスパムの温床のため、Googleは一切評価に用いていない"],"correct":[0],"explain":"外部要素は引用の『量』ではなく『質』（どんな文脈・信頼性のサイトからか）が重視されます。人工的な自作リンクはガイドライン違反で、外部要素が無視されるわけでもありません。"}]
