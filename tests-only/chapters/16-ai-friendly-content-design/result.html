[{"id":"q1","type":"single","sectionIndex":0,"question":"Google公式ガイドが、AI検索での露出に最も影響すると述べている要素はどれか。","options":["1日に公開する記事の本数をできるだけ多くすること","サイトのドメイン名をできるだけ短くすること","人々にとって独自で、説得力があり、有用だとみなされるコンテンツを作ること","AI専用の特殊なファイルを大量に用意すること"],"correct":[2],"explain":"AI検索での露出に最も効くのは、独自で有用なコンテンツです。公開本数やドメイン名の長さ、AI専用ファイルの量は本質ではありません。"},{"id":"q2","type":"single","sectionIndex":0,"question":"「一次情報」の説明として、最も適切なものはどれか。","options":["複数の他サイトの内容をまとめ直した情報","検索結果で最も上位に表示されているサイトの情報","最も新しく公開された情報","自ら得た経験・データ・調査結果などに基づく情報"],"correct":[3],"explain":"一次情報は自ら得た経験・データ・調査に基づく情報です。他サイトのまとめ直しは二次情報で、上位表示や新しさは一次情報の定義ではありません。"},{"id":"q3","type":"multi","sectionIndex":1,"question":"Google公式ガイドが明言している内容として、正しいものをすべて選べ。","options":["AI検索対応のために、新しいAI専用のテキストファイルや独自マークアップを作成する必要はない","Googleの生成AIモデルは、クロール可能な公開コンテンツを学習・参照に利用する","段落・セクションで整理され、明確な見出しがあるページが評価される傾向にある","AI検索に対応するには、必ず有料の専用ツールを導入しなければならない"],"correct":[0,1,2],"explain":"Google公式ガイドは、AI専用ファイルやマークアップは不要であること、クロール可能なコンテンツが前提であること、整理された文章構造が評価されやすいことを明言しています。有料ツールの導入は必須ではありません。"},{"id":"q4","type":"single","sectionIndex":2,"question":"AI検索時代における情報の更新・鮮度についての考え方として、最も適切なものはどれか。","options":["古くなった情報を放置せず、独自の視点や一次情報を継続的に追加していくことが有効と考えられる","一度公開した記事は、二度と更新する必要はない","情報の鮮度は、AI検索には一切関係しない","更新頻度を上げるために、内容を確認せずに公開日だけを書き換えればよい"],"correct":[0],"explain":"古くなった情報を放置せず、独自の視点や一次情報を継続的に追加していくリライトの考え方は、SEOとLLMOの両方にとって有効なアプローチだと考えられます。"},{"id":"q5","type":"single","sectionIndex":2,"question":"Google検索の視点から見た「生成AI検索の最適化」についての公式見解として、最も適切なものはどれか。","options":["生成AI検索の最適化は、従来のSEOとは全く別の、無関係な取り組みである","生成AI検索の最適化は検索体験の最適化であり、依然としてSEOである","生成AI検索に対応するには、SEOの知識は一切不要である","生成AI検索の最適化には、公式な見解は存在しない"],"correct":[1],"explain":"Google公式ガイドは「Google検索の視点から見れば、生成AI検索の最適化は検索体験の最適化であり、依然としてSEOである」と明言しています。"}]
