<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Console（基礎）（採点結果） | SEO確認テスト</title>
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a href="../../index.html" class="site-header__title">📋 SEO 確認テスト</a>
    <nav class="site-header__nav">
      <a href="../../index.html">テスト一覧</a>
    </nav>
  </div>
</header>
<div class="course-progress">
  <div class="course-progress__bar"><div class="course-progress__fill" data-course-progress-fill></div></div>
  <div class="course-progress__label" data-course-progress-label>0 / 19 章 合格済み</div>
</div>

<main>
  <a href="../../index.html" class="breadcrumb-back">← テスト一覧</a>

  <div class="wizard-header">
    <span class="time-badge">🕒 学習目安 約18分</span>
    <h1 class="wizard-header__title">Search Console（基礎）</h1>
    <p class="wizard-header__topics">登録：所有権確認、インデックス：URL検査、把握：全URLリストの作成、クロール・レンダリングの健全性確認</p>
  </div>

  <div class="result-summary" data-result-summary>
    <div class="result-summary__icon" data-result-icon>🏆</div>
    <div class="result-summary__title">確認テスト結果</div>
    <div class="result-summary__score" data-result-score>--%</div>
    <div class="result-summary__sub" data-result-sub></div>
    <div class="result-status" data-result-status></div>
  </div>

  <div class="result-review">
    <div class="result-review__head">
      <div class="result-review__title">回答一覧と解説</div>
      <div class="result-review__hint">間違えた問題は「関連する教材を見直す」から該当ページを確認できます</div>
    </div>
    <div data-result-list></div>
  </div>

  <div class="result-actions">
    <button class="btn btn--primary" data-result-retry>↻ テストを再受験</button>
    <a href="../../index.html" class="btn btn--muted">一覧に戻る</a>
  </div>

  <script type="application/json" data-quiz-data>
[{"id":"q1","type":"single","sectionIndex":0,"question":"Search Consoleの説明として、最も適切なものはどれか。","options":["サイト訪問後のユーザー行動（滞在・回遊・CV）を計測するツール","検索広告の入札単価やキーワードを管理するツール","自サイトが検索結果でどう扱われているかを確認・管理できるGoogleの無料ツール","競合サイトの被リンクを網羅的に取得する有料ツール"],"correct":[2],"explain":"Search Consoleは検索結果での扱いを確認・管理する無料ツールです。訪問後の行動計測はGA4、広告管理はGoogle広告など、役割が異なります。"},{"id":"q2","type":"single","sectionIndex":0,"question":"「ドメインプロパティ」の特徴として、最も適切なものはどれか。","options":["特定のURL配下のみを対象とする","所有権確認の方法はHTMLファイルのアップロードのみである","ドメインプロパティは現在Googleでは利用できない","サブドメインを含むドメイン全体を対象とし、http/https/wwwの有無を問わずまとめて扱う"],"correct":[3],"explain":"ドメインプロパティは、サブドメインを含むドメイン全体を対象とし、http/https/wwwの有無を問わずまとめて1つとして扱われます。"},{"id":"q3","type":"single","sectionIndex":1,"question":"Search Consoleの所有権確認に関する説明として、正しいものはどれか。","options":["所有権が確認されるまでは、詳細な情報の閲覧や各種機能の利用ができない","所有権確認をしなくても、すべての機能をすぐに使うことができる","所有権確認の方法はDNSレコードへの追記のみである","所有権確認は一度も行う必要がない"],"correct":[0],"explain":"プロパティ追加時点からデータ収集は始まりますが、所有権が確認されるまでは詳細な情報の閲覧や機能の利用はできません。"},{"id":"q4","type":"multi","sectionIndex":2,"question":"URL検査ツールで確認できる情報として、正しいものをすべて選べ。","options":["そのページがインデックスに登録されているかどうか","最後にGooglebotがそのページをクロールした日時","ページで検出された構造化データの有無","そのページを閲覧したユーザーの氏名"],"correct":[0,1,2],"explain":"URL検査ツールでは、インデックス状況、最終クロール日時、構造化データの検出状況などを確認できます。個人を特定する情報は扱いません。"},{"id":"q5","type":"single","sectionIndex":2,"question":"URL検査ツールから「インデックス登録をリクエスト」した場合の説明として、最も適切なものはどれか。","options":["リクエストした瞬間に、必ず検索結果の1位に表示される","リクエストしても、必ずすぐにクロール・インデックスされるとは限らない","リクエストは1サイトにつき生涯で1回しか行えない","インデックス登録のリクエストという機能はSearch Consoleには存在しない"],"correct":[1],"explain":"インデックス登録をリクエストすることはできますが、リクエストしたからといって必ずすぐにクロール・インデックスされるとは限りません。"},{"id":"q6","type":"multi","sectionIndex":3,"question":"サイト全体のURLを整理する際に確認すべき観点として、正しいものをすべて選べ。","options":["URLの階層や命名ルールの規則性","title・descriptionの重複や記述ミスの有無","無限に生成されうるパラメータ付きURLの有無","サイト運営会社の資本金の額"],"correct":[0,1,2],"explain":"URLの階層・規則性、title・descriptionの重複や記述ミス、パラメータURLの有無などは、サイト全体を把握する上で確認すべき観点です。資本金の額はSEOのURL整理には関係ありません。"},{"id":"q7","type":"single","sectionIndex":3,"question":"サイトのURLを取得・整理することの意義として、最も適切なものはどれか。","options":["URLを整理しても、SEO戦略にはまったく関係しない","URLは一度整理したら二度と確認する必要がない","サイトの全容を把握することが、場当たり的でない改善施策を考えるための土台になる","URLの整理はクロールツールだけで完結し、Search Consoleの情報は不要である"],"correct":[2],"explain":"サイトの全容を正確に把握することは、部分的な対応に終始せず、本質的な改善施策を検討するための土台になります。クロールツールに加え、Search Consoleやsitemap.xmlの情報もあわせて活用することが推奨されます。"},{"id":"q8","type":"single","sectionIndex":4,"question":"クロールの健全性を確認する観点として、最も適切なものはどれか。","options":["画像のalt属性が全ページで同一の文言に統一されているか","競合サイトより表示速度がわずかでも速いか","直帰率やセッション時間が改善しているか","robots.txtで重要ページを誤ってブロックしていないか、404・500エラーが多発していないか"],"correct":[3],"explain":"クロールの健全性は、robots.txtの誤ブロックや404・500エラーの多発などで確認します。alt統一や直帰率などはクロール健全性の観点ではありません。"},{"id":"q9","type":"single","sectionIndex":4,"question":"レンダリングの健全性を確認する方法として、最も適切なものはどれか。","options":["URL検査ツールで、Googlebotが取得・解釈したHTMLやスクリーンショットを確認する","ブラウザのソース表示で、サーバーが返す初期HTMLだけを確認する","GA4のリアルタイムレポートで表示回数を確認する","PageSpeed Insightsのスコアだけで判断する"],"correct":[0],"explain":"レンダリングの健全性は、URL検査ツールでGooglebotが解釈した後のHTMLやスクリーンショットを確認するのが確実です。初期HTMLや速度スコアだけでは判断できません。"}]
  </script>

</main>
