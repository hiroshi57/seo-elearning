  <script type="application/json" data-quiz-data>
[{"id":"q0a","type":"single","sectionIndex":0,"question":"生成AIと検索エンジンの技術的な関係についての説明として、最も適切なものはどれか。","options":["生成AIと検索エンジンは、技術的にまったく無関係な別々の技術である","検索エンジンは今後、生成AIに完全に置き換えられてなくなる","生成AIは、検索エンジンが培ってきた自然言語処理技術の延長線上で生まれた技術であり、両者は地続きの関係にある","生成AIはランキングや検索意図の理解には一切関わっていない"],"correct":[2],"explain":"検索エンジンで培われてきた言語理解モデルと生成AIのモデルは、共通してトランスフォーマー構造を基盤とした言語モデルの進化の延長線上にあり、検索と生成は技術的に分断されたものではありません。"},{"id":"q0b","type":"single","sectionIndex":0,"question":"LLM（大規模言語モデル）の基本的な仕組みの説明として、最も適切なものはどれか。","options":["あらかじめ人間が定義した文法規則のみに基づいて動作する","検索結果の広告枠の入札額を自動計算する仕組みである","Webページの表示速度を計測するための仕組みである","大量のテキストデータを学習し、文脈に応じて次に現れる単語を予測する仕組みを基本とする"],"correct":[3],"explain":"LLMは大量のテキストデータを学習し、文脈に応じて次に現れる単語を予測する自己回帰型の仕組みを基本としており、これが文章生成や要約、対話能力の基盤になっています。"},{"id":"q1","type":"single","sectionIndex":1,"question":"AI Overviewの説明として、最も適切なものはどれか。","options":["複数のWebページをもとにAIが生成した要約回答を、検索結果の上部に表示する機能","上位表示されたページの本文を、そのまま全文引用して表示する機能","ユーザーの過去の検索履歴だけを一覧表示する機能","有料広告の見出しをAIが自動生成して表示する機能"],"correct":[0],"explain":"AI Overviewは複数ページを基にAIが生成した要約を検索上部に表示します。全文引用でも、履歴表示でも、広告生成機能でもありません。"},{"id":"q1b","type":"single","sectionIndex":1,"question":"AI Overviewの普及にともなう検索行動の変化についての説明として、最も適切なものはどれか。","options":["検索結果からのクリック率は、AI Overviewの導入によって一切変化していない","検索結果ページ上で疑問が解決し、サイトへのクリックが発生しない「ゼロクリック検索」が増加しているとされる","AI Overviewが表示されると、必ず全ユーザーがリンクをクリックするようになる","ゼロクリック検索はAI Overviewの登場以前には存在しなかった概念である"],"correct":[1],"explain":"AI Overviewの普及にともない、検索結果ページ上で要点を把握してサイトへ遷移しない「ゼロクリック検索」が増加しているとされ、従来の「上位表示されれば流入が増える」という前提が崩れつつあります。"},{"id":"q2","type":"single","sectionIndex":2,"question":"AI ModeとAI Overviewの違いに関する説明として、最も適切なものはどれか。","options":["AI Modeは有料契約者専用、AI Overviewは無料版という料金上の違いである","AI Modeはモバイル専用、AI OverviewはPC専用という対応端末の違いである","AI Modeは対話形式で複雑な比較・深掘りができ、AI Overviewは検索結果の一部として要約を表示する","AI Overviewが対話でき、AI Modeは要約表示のみという逆の関係である"],"correct":[2],"explain":"AI Modeは対話で深掘りできる検索体験、AI Overviewは結果の一部としての要約表示です。料金・端末・役割の逆転といった説明は誤りです。"},{"id":"q3","type":"single","sectionIndex":3,"question":"AI Overview・AI Modeに表示されるための要件について、Google公式が示している見解として、最も適切なものはどれか。","options":["AIスキーマやAI用metaタグなど、専用マークアップの追加が必須である","AI検索への表示には、Google広告への一定の出稿が条件になる","llms.txtという専用ファイルの設置が必須要件である","AI検索機能に表示されるための特別な追加要件や専用の最適化は存在しないとしている"],"correct":[3],"explain":"Googleは、AI検索機能への表示に特別な追加要件や専用最適化は不要としています。専用マークアップや広告出稿、専用ファイルが必須という事実はありません。"},{"id":"q4","type":"multi","sectionIndex":3,"question":"AI検索機能への対応として、Google公式が重要だとしている要素をすべて選べ。","options":["クロールのしやすさ・サイト構造・モバイル対応・表示速度","独自性があり、訪問者にとって満足度の高いコンテンツ","E-E-A-T（経験・専門性・権威性・信頼性）","サイトのドメイン名の文字数をできるだけ短くすること"],"correct":[0,1,2],"explain":"クロールのしやすさ・サイト構造・独自性のあるコンテンツ・E-E-A-Tは、Google公式がAI検索機能への対応でも重要だとしている要素です。ドメイン名の文字数は関係ありません。"},{"id":"q5","type":"single","sectionIndex":3,"question":"AI検索時代におけるSEOの基本の位置づけについて、最も適切なものはどれか。","options":["AI検索機能への対応は、これまで学んだSEOの基本の延長線上にある","AI検索の登場により、これまでのSEOの基本はすべて無意味になった","AI検索対策とSEO対策は、完全に別々の、無関係な取り組みである","AI検索が普及したため、コンテンツの品質はもはや評価に関係しない"],"correct":[0],"explain":"Google公式の方針によれば、AI検索機能への対応は、クロール・サイト構造・独自性・E-E-A-Tといった、これまで学んだSEOの基本の延長線上にあります。"}]
